# ============================================================
# COMPARISON — HeteroFL  (Battery → Discrete Capacity Levels)
# 4 levels: battery <25% → 25% layers, <50% → 50%, <75% → 75%, ≥75% → 100%
# Discrete tier assignment (vs continuous β_k in Server-Mask).
# battery_max_j = ESP32-S3 full capacity (auto-calibrated from fleet ~13320J)
# ============================================================
seed: 42
output_dir: "./results/comparison_server_mask/heterofl"
device: mps

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 1.0
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: heterofl
  algo_config:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 5
    batch_size: 32
    battery_max_j: 13320     # ESP32-S3 full capacity at 100% SOC
    energy_scale_factor: 12.6

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 3
  fleet:
    - type: esp32_s3
      count: 30
  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.95
