# ============================================================
# Benchmark : Comparaison équitable — 3 algorithmes
#   fed_resonance | ccsEF (full) | server_mask
# ============================================================
# Scénario : 30 ESP32-S3, SOC uniforme [5%, 95%], CIFAR-10/ResNet-8
# Dirichlet α=0.5 (non-IID modéré), 200 rounds
# Optimizer : Adam (lr=0.01, weight_decay=1e-4)
# Epochs    : E=5 (comparaison équitable — même budget compute)
#
# Usage
# -----
#   for ALGO in fed_resonance ccsEF_full server_mask; do
#     python run_experiment.py \
#       --config configs/algo_comparison_iid05_m3.yaml \
#       --algo $ALGO \
#       --output results/comparison_iid05_m3/${ALGO} \
#       --device mps
#   done
#
# Calibration energie
# -------------------
#   ESP32-S3 full-model training cost ≈ 2.33 J/round (profil matériel)
#   energy_scale_factor = 12.6 → mean_cost ≈ 29.4 J/round
#   mean_battery (SOC 50%) = 1850 J → T* ≈ 63 rounds
#   → tous les clients meurent ~round 63-70 si pas de gestion adaptative
#
# Paramètres communs (toujours utilisés par tous les algos)
# ----------------------------------------------------------
#   lr, local_epochs, batch_size, energy_scale_factor
#   beta_min, beta_max, battery_max_j  (eceffl + fed_resonance)
#   warmup_rounds, num_tiers, ...      (fedpart + fedstep, ignorés par les autres)
# ============================================================

seed: 42
output_dir: "./results/comparison_iid05_m3"
layer_mismatch: false
device: mps

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 0.5
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedstep       # écrasé par --algo en CLI
  algo_config:

    # ── Hyperparamètres communs ──────────────────────────────────────────
    lr: 0.001
    optimizer: adam          # adam | sgd  — commun aux 3 algos
    momentum: 0.9            # ignoré si optimizer=adam
    weight_decay: 1.0e-4
    local_epochs: 5          # E=5 pour comparaison équitable
    batch_size: 32
    # Warmup commun — à changer ICI pour tous les algos simultanément
    # server_mask lit "warmup_rounds", ccsEF lit "ccsEF_warmup_rounds"
    # → les deux doivent rester égaux pour une comparaison équitable
    warmup_rounds: 5         # server_mask + fedstep

    # ── Modèle de batterie (commun : eceffl, fed_resonance, fedstep) ──
    # beta_t^k = beta_min + (beta_max - beta_min) * B_t^k / B_max
    # Avec SOC [5%, 95%] → beta ∈ [0.01, 0.95] selon l'état de charge
    beta_min: 0.01           # compression minimale garantie (participation universelle)
    beta_max: 0.75            # compression maximale (client pleinement chargé)
    battery_max_j: 13320.0   # capacité nominale ESP32-S3 : 1000mAh × 3.7V × 3.6 = 13320 J

    # ── Facteur d'échelle énergie (calibration identique pour tous) ──────
    # Appliqué après le calcul du profil matériel : energy_j *= energy_scale_factor
    # ECEFFL raw ≈ 6.6 J/client/round → ×12.6 = 83 J → client min (1191J) meurt ~rd 14
    # Fed-Resonance raw ≈ 0.5 J/client/round → ×12.6 = 6.3 J → client min meurt ~rd 189
    # Différence normale : Fed-Resonance compresse mieux → moins de bytes → moins d'énergie TX
    energy_scale_factor: 12.6

    # ── Paramètres fed_resonance (ignorés par eceffl, fedpart, fedstep) ─
    rank_min: 4              # rang SVD minimum
    rank_max: 8             # rang SVD maximum
    spectral_energy_thresh: 0.95   # fraction d'énergie spectrale à capturer
    subspace_drift_thresh: 0.1     # seuil de dérive pour basculer SVD→subspace
    rank_coherence_thresh: 0.7     # alignement minimum pour mode subspace
    use_error_feedback: true       # error feedback (EF) activé
    use_rsvd: true                 # SVD randomisé (plus rapide pour grandes matrices)
    rsvd_oversample: 15         # dimensions supplémentaires pour améliorer la précision de la SVD randomisée. Recommandé : 5-20 (0 = désactivé, équivalent à SVD classique, mais plus lent) Quand rsvd_oversample = 10, c'est un bon compromis : améliore la précision de la SVD randomisée pour les petits rangs (4-8) sans ajouter beaucoup de coût de calcul.
    rsvd_power_iter: 3        # itérations de puissance pour améliorer la précision de la SVD randomisée. Recommandé : 1-3 (0 = désactivé, équivalent à SVD classique, mais plus lent) Quand rsvd_power_iter = 3, c'est plus lent que la SVD classique pour les petites matrices, mais plus rapide pour les grandes (ex. >100k éléments) tout en restant précis. C'est plus rapide pour les rangs plus élevés (8) que pour les rangs plus bas (4), car la SVD randomisée est plus rapide que la SVD classique à mesure que la taille de la matrice augmente, et l'oversampling améliore la précision pour les petits rangs.

    # ── Paramètres fedpart / fedstep (ignorés par eceffl, fed_resonance) ─
    warmup_rounds: 5               # rounds FedAvg complet avant PNU
    num_tiers: 3                   # nombre de groupes d'énergie
    server_lr: null                # auto = 1/num_tiers = 0.333
    assignment_strategy: quantile  # quantile | proportional
    mu_repr: 0.01                   # régularisation représentativité (0 = désactivé)
    mu_weight: 0.01                 # régularisation poids (0 = désactivé)
    ema_model_alpha: 0             # EMA sur poids modèle (0 = désactivé)
    ema_alpha: 0.3                 # EMA sur coût estimé par groupe
    verbose_groups: false
    rotation_period: 2            # T_rot optimal (0 collisions avec schedule de mort)
    adaptive_rotation: false        # étend T_rot quand des clients meurent
    inter_cycle_rounds: 0          # rounds full-training inter-cycle (0 = désactivé)

    # ── Paramètres server_mask (ignorés par fed_resonance, ccsEF) ───────────
    # mu_weight et ema_alpha partagés avec la section fedpart ci-dessus (mêmes valeurs)
    epsilon_explore: 0.05          # ε-greedy exploration des masques (5% aléatoire)

    # ── Paramètres ccsEF full / ccsEF frozen (ignorés par les autres algos) ──
    # ccsEF = Complementary Cluster Split with Error Feedback (Nikiema & Amhoud, 2026)
    # Modèle partitionné en g1 (early layers) + g2 (late layers + FC)
    # Clients partitionnés en C1 (haute batterie) + C2 (basse batterie, assignation statique)
    # Phase 0 : C1→g1 (primaire), C2→g2 (primaire) ; Phase 1 : swap
    # EF sur groupe primaire (TopK+buffer) ; buffer secondaire accumulé sans transmission
    ccsEF_warmup_rounds: 5         # DOIT rester = warmup_rounds ci-dessus (comparaison équitable)
    lr_min: null                   # cosine LR decay floor (null = LR constant)
    max_grad_norm: 10.0            # gradient clipping

    T_rot: 2                       # période de rotation (échange C1↔C2 toutes T_rot rounds)
                                   # T_rot=1 : biais 2-round minimal O(ηLζ²)
                                   # T_rot=3 : best Acc=76.35%, 20/30 alive rd200
    fleet_median_battery: null     # seuil C1/C2 (null = 0.5 * battery_max_j = 6660 J) : mis à jour automatiquement par le serveur
    T_recluster: 10        # fréquence de re-clustering (0 = comportement statique original). Optimal = 6 pour éviter le désalignement avec T_rot
                           # Si T_recluster = k × M × T_rot, le recluster se produit toujours à la
                           # même position dans le cycle — tous les buffers viennent d'être mis à jour dans les M×T_rot derniers rounds.
    # ATTENTION — server_momentum sous non-IID fort :
    # Avec M=3 et rotation, chaque partition reçoit les gradients d'un cluster différent
    # à chaque phase. Avec momentum=0.9, le buffer momentum mélange des mises à jour
    # de distributions très différentes (α=0.1) → amplifie la divergence.
    # Réglages recommandés :
    #   ccsEF_full  : 0.9 acceptable (full backward atténue les conflits de gradient)
    #   ccsEF_frozen: 0.0 ou 0.3 (partial gradient → conflits amplifiés par momentum fort)
    server_momentum: 0.9
    use_fp16_uplink: true     # valeurs sparse en float16 : 6 bytes/nz vs 8 (-25% uplink)
    partial_downlink: false
    num_partitions: 3

    # ccsEF full  → full backward sur g1+g2 ; EF accumulé sur le groupe secondaire
    # ccsEF frozen → backward uniquement sur groupe primaire (requires_grad=False sur secondaire)
    #                EF buffer secondaire non mis à jour ce round
    #                E_comp réduit de ~33% → meilleure survie, couverture gradient partielle
    #
    # LIMITATION CONNUE (ccsEF_frozen, α ≤ 0.1) :
    #   Avec freeze_secondary + non-IID fort, chaque partition ne reçoit des gradients
    #   que d'un seul cluster par phase. Sous α=0.1, les clusters ont des distributions
    #   quasi-disjointes → gradients antagonistes entre phases → oscillation non convergente.
    #   ccsEF_full n'a pas ce problème : les buffers EF secondaires accumulent les corrections.
    #   → Pour α ≤ 0.1, utiliser ccsEF_full.  ccsEF_frozen est adapté à α ≥ 0.3.
    #
    # La valeur ci-dessous est écrasée par --algo ccsEF_full / ccsEF_frozen dans le CLI
    freeze_secondary_backward: false   # false = ccsEF full ; true = ccsEF frozen

    # Buffer age reset (Option 4) — activé par défaut.
    # Remet à zéro le buffer EF primaire si âge > M × T_rot (client a changé de cluster).
    # false = désactiver pour observer l'effet de la staleness (ablation).
    buffer_age_reset: false

    # Option 5 — priming sans transmission après changement de cluster.
    # Le client fait SGD + EF pour primer le buffer, mais ne transmet rien ce round.
    # Coût : compute + downlink uniquement (pas d'uplink).
    buffer_priming: true

    # Clipping du vecteur EF u = Δg + e avant TopK.
    # Prévient l'explosion du buffer quand β est petit (1-β > 0.5) en fin d'entraînement.
    # ATTENTION (non-IID fort) : 3.0 est trop agressif sous α=0.1 — les gradients sont
    # plus grands, et le clipping élimine de l'information qui ne va PAS dans le buffer
    # (seul u_clipped - v est stocké, pas u_original - u_clipped → perte permanente).
    # null = désactivé (recommandé pour α ≤ 0.3). Recommandé si activé : 5.0–10.0 si data_IID est élevé (0.3-0.5)
    ef_clip_norm: null

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 3

  fleet:
    - type: esp32_s3
      count: 30

  # SOC uniforme [5%, 95%] — flotte IoT hétérogène
  # Spread = 19× → condition optimale pour comparaison survival
  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.95
