# ============================================================
# FedStep — Experiment B: Wide Battery Spread (SOC [5%, 95%])
# ============================================================
# Scénario : 30 ESP32-S3 avec batteries très hétérogènes, représentant
# une flotte IoT en fonctionnement continu (certains appareils récemment
# chargés, d'autres presque vides).
#
# Pourquoi ce scénario est le bon pour FedStep (Option A)
# ---------------------------------------------------------
# Avec un spread large (spread = B_max/B_min = 19×) :
#
#   Théorème d'Option A : si cost_k ∝ battery_k,
#     tous les clients meurent au même round T* = mean_battery / mean_cost
#     → participation maximale simultanée → meilleure accuracy
#
#   FedPart (round-robin) : les clients à 5% SOC (185J) meurent dès
#     warmup round 2-3 (warmup coûte ~74.5J/round × 12.6).
#     Le modèle s'entraîne ensuite sur un sous-ensemble biaisé → accuracy ↓
#
#   FedStep proportionnel :
#     - Client 5% SOC → groupe le moins cher → coût ≈ 10% de mean_cost
#       → survive ~8× plus longtemps qu'en FedPart
#     - Client 95% SOC → groupe le plus cher → drain proportionnel
#     - Tous morts autour de T* = mean_SOC × capacity / mean_cost ≈ round 60-80
#     - Mais TOUS les 30 clients actifs jusqu'à T* → gradients diversifiés
#
# Condition de validité d'Option A
# ---------------------------------
#   L'assignation proportionnelle est stable seulement si le spread batterie
#   est assez large pour que les clients se distribuent sur tous les tiers.
#   SOC [5%, 95%] → batteries en [185J, 3515J] → mean=1850J
#   Tier 0 reçoit clients avec battery < 0.6×mean = <1110J  (~10 clients)
#   Tier 1 reçoit clients avec battery ∈ [0.6×, 1.4×] mean  (~10 clients)
#   Tier 2 reçoit clients avec battery > 1.4×mean = >2590J  (~10 clients)
#   → distribution équilibrée → gradients stables
#
# Comparaison attendue (seed=42)
# --------------------------------
#   FedAvg            : Best ~70%, tous morts ~round 30 (warmup kills low-SOC fast)
#   FedPart           : Best ~55-60%, 50% dropout ~round 20 (expensive groups kill fast)
#   FedStep (Opt A) : Best ~62-65%, 50% dropout ~round 50 (proportional drain)
#   FedPartUniversal  : Best ~55%, last client ~round 60
#
# Usage
# -----
#   # Lancer FedStep avec assignation proportionnelle :
#   python run_experiment.py --config configs/fedpartbe_survival_wide.yaml --device mps
#
#   # Comparer avec FedPart sur même scénario :
#   python run_experiment.py --config configs/fedpartbe_survival_wide.yaml \
#       --algo fedpart --output results/fedpartbe_wide/fedpart
# ============================================================

seed: 42
output_dir: "./results/fedpartbe_wide"
device: mps

# ── Layer Mismatch Diagnostic ─────────────────────────────────────────────────
# Active ou désactive le diagnostic de désalignement inter-couches après chaque
# agrégation FedAvg/FedStep. Résultats sauvegardés dans metrics.json :
#   round_metrics["layer_mismatch"] : score scalaire ∈ [0, 1]
#     0 = aucun désalignement  |  1 = désalignement sévère
layer_mismatch: false

layer_mismatch_config:
  # Calculer le diagnostic tous les N rounds (1 = chaque round, 10 = allège le coût CPU).
  # Rounds non calculés → layer_mismatch: null dans metrics.json.
  freq: 10

  # Couches à surveiller. null = auto-détection de toutes les couches Conv2d+Linear.
  # Exemple explicite : [stem, layer1._pair1, layer2._pair1, layer3._pair1, fc]
  layers: null

  # Métriques à activer. null = les trois. Choisir un sous-ensemble pour aller plus vite.
  #   drift      : dérive des activations avant/après agrégation (‖h_avant - h_après‖_F)
  #   loss_jump  : saut de perte quand le client passe du modèle local au modèle global
  #   cka        : similarité CKA entre représentations de différents clients
  metrics: [drift, loss_jump, cka]

  # ── Contrôles de performance ─────────────────────────────────────────────────
  # max_batches_per_client : nombre de mini-batchs utilisés par client pour loss_jump.
  #   Défaut = 2 (≈64 échantillons). Toute la dataloader = lent (30 clients × 52 batchs).
  #   2 batchs → 26× plus rapide, estimation suffisante pour le diagnostic.
  max_batches_per_client: 2

  # max_clients_cka : nombre de clients échantillonnés pour le calcul CKA pairwise.
  #   Défaut = 8. Avec 30 clients : C(30,2)=435 paires → C(8,2)=28 paires (16× moins).
  #   Les 8 clients sont tirés aléatoirement (seed fixe pour reproductibilité).
  max_clients_cka: 8

data:
  dataset: cifar100
  model: resnet8
  partition: dirichlet
  alpha: 0.5
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedstep
  algo_config:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    warmup_rounds: 5
    num_tiers: 2
    server_lr: null            # auto = 1/num_tiers = 0.333
    assignment_strategy: quantile #proportional  # Option A — optimal pour spread large
    mu_repr: 0.01
    mu_weight: 0.01
    ema_model_alpha: 0.0   # w_ema_{t+1} = 0.1·w_ema_t + 0.9·w_brut_{t+1}
    verbose_groups: false
    # Bucket rotation: every rotation_period rounds, shift which cost-bucket each
    # tier trains by one position. Ensures each layer group is trained by all
    # energy strata over time, preventing data-distribution bias.
    # With num_tiers=3: full cycle = 30 rounds.
    rotation_period: 2
    # adaptive_rotation: étend T_rot proportionnellement aux morts de clients.
    # T_rot_eff(r) = rotation_period × ceil(K_0 / K_alive(r))
    # Maintient un budget gradient constant par phase → élimine les compound drops.
    adaptive_rotation: false
    # Inter-cycle full training rounds — 0 = disabled.
    inter_cycle_rounds: 0
    # Même calibration que les autres expériences pour comparaison directe.
    # Avec SOC [5%, 95%], mean_battery ≈ 1850J :
    #   T* = 1850 / (2.33 × 12.6) ≈ 63 rounds → tous morts ~round 63-70
    # Les clients à 5% SOC (185J) meurent pendant warmup (les 2 premières
    # rounds de warmup coûtent 2×74.5J = 149J < 185J — tout juste survivant).
    # Ceci est intentionnel : montre que même les clients les plus faibles
    # peuvent contribuer en phase PNU avec FedStep.
    energy_scale_factor: 12.6
    max_grad_norm: 10.0
    ema_alpha: 0.3

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random #
  min_clients: 3              # réduit car certains clients meurent tôt

  fleet:
    - type: esp32_s3
      count: 30

  # Battery initialization: uniform SOC in [5%, 95%]
  # Représente une flotte hétérogène : certains appareils récemment chargés
  # (95% SOC = 3515J), d'autres presque vides (5% SOC = 185J).
  # Spread = 19× → condition optimale pour l'assignation proportionnelle.
  # C'est le scénario réaliste d'un déploiement IoT longue durée.
  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.95
