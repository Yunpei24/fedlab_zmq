schema_version: 1
lane: faithful
revision: partition_ablation_client_dirichlet_balanced_v1
source: internship_report_experiment_3_partition_ablation
description: >-
  Ablation appariee de l'experience 3. Elle conserve les methodes, budgets DP,
  seeds et hyperparametres de la campagne algorithm_fidelity_v4, mais utilise
  une Dirichlet des proportions de classes par client avec tailles controlees.
expected_runs: 54

scenarios:
  - id: exp3_privacy_fairness_client_dirichlet_balanced
    seeds: [28, 36, 54]
    base_config:
      device: cpu
      data:
        dataset: mnist
        partition: client_dirichlet_balanced
        alpha: 0.1
        partition_policy: shared_across_training_seeds
        partition_seed: 28
        data_root: ./data
      model:
        architecture: lenet5
      training:
        num_rounds: 40
        cost_model: measured
        algo_config:
          lr: 0.01
          momentum: 0.0
          weight_decay: 0.0
          local_epochs: 2
          far_update_mode: multi_epoch_delta
          far_prox_mu: 0.01
          batch_size: 64
          client_metrics_every: 2
          fairness_tail_fraction: 0.2
      clients:
        num_clients: 10
        sample_fraction: 1.0
        sampling_strategy: random
        min_clients: 10
        fleet:
          - type: raspberry_pi_4
            count: 10
        battery_init:
          distribution: uniform_soc
          params: {min_soc: 0.95, max_soc: 0.95}
      eval:
        eval_every: 2
        honest_clients_only: true
        metrics:
          - test_accuracy
          - honest_client_accuracy_mean
          - honest_client_accuracy_variance
          - honest_client_worst_20_accuracy
          - honest_client_best_20_accuracy
          - honest_client_best_worst_gap
          - fedfdp_balanced_fairness_psi
          - privacy_epsilon_max
          - privacy_delta
          - privacy_best_order_mean
          - privacy_model_noise_multiplier
          - privacy_loss_noise_multiplier
    conditions:
      - id: epsilon_infinity
        privacy:
          model: none
          target_epsilon: infinity
        attacks:
          - id: none
            config: null
        methods:
          - id: dp_fedavg
            algorithm: fedavg
          - id: dp_qffl_q1
            algorithm: qffl
            algo_config:
              q: 1.0
              lipschitz: 100.0
              aggregation_prior: uniform
          - id: dp_far_alpha_m1p5
            algorithm: far
            algo_config: &far_no_dp_common
              far_alpha: -1.5
              robust_reference: cm_nnm
              num_byzantine: 2
          - id: dp_far_alpha_m0p5
            algorithm: far
            algo_config:
              <<: *far_no_dp_common
              far_alpha: -0.5
          - id: dp_far_alpha_m0p1
            algorithm: far
            algo_config:
              <<: *far_no_dp_common
              far_alpha: -0.1
          - id: dp_far_alpha_0p1
            algorithm: far
            algo_config:
              <<: *far_no_dp_common
              far_alpha: 0.1
          - id: dp_far_alpha_0p4
            algorithm: far
            algo_config:
              <<: *far_no_dp_common
              far_alpha: 0.4
          - id: dp_far_alpha_1p0
            algorithm: far
            algo_config:
              <<: *far_no_dp_common
              far_alpha: 1.0
          - id: fedfdp
            algorithm: fedfdp
            algo_config:
              fairness_lambda: 0.1
              clip_norm: 1.0
              loss_clip: 2.5
              adaptive_loss_clip: false
              enable_dp: false

      - id: epsilon_3p56
        privacy:
          model: local_dp
          target_epsilon: 3.56
          delta: 1.0e-5
          adjacency: record_replace_one
          accountant: rdp
          calibration_required: true
        algo_config:
          target_epsilon: 3.56
          delta: 1.0e-5
          clip_norm: 1.0
        attacks:
          - id: none
            config: null
        methods:
          - id: dp_fedavg
            algorithm: dpfedavg
            requires: [target_epsilon_calibration, per_example_dpsgd]
          - id: dp_qffl_q1
            algorithm: dpqffl
            requires:
              - target_epsilon_calibration
              - per_example_dpsgd
              - private_loss_channel
            algo_config:
              q: 1.0
              lipschitz: 100.0
              aggregation_prior: uniform
          - id: dp_far_alpha_m1p5
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config: &far_dp_common
              far_alpha: -1.5
              robust_reference: cm_nnm
              num_byzantine: 2
          - id: dp_far_alpha_m0p5
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              <<: *far_dp_common
              far_alpha: -0.5
          - id: dp_far_alpha_m0p1
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              <<: *far_dp_common
              far_alpha: -0.1
          - id: dp_far_alpha_0p1
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              <<: *far_dp_common
              far_alpha: 0.1
          - id: dp_far_alpha_0p4
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              <<: *far_dp_common
              far_alpha: 0.4
          - id: dp_far_alpha_1p0
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              <<: *far_dp_common
              far_alpha: 1.0
          - id: fedfdp
            algorithm: fedfdp
            requires: [target_epsilon_calibration, private_loss_channel]
            algo_config:
              fairness_lambda: 0.1
              loss_clip: 2.5
              adaptive_loss_clip: false
              loss_noise_calibration: compose_with_model_channel

