schema_version: 1
lane: paper-grade
source: proposed_extension_not_in_internship_report
description: >-
  Extension confirmatoire, explicitement separee de la reproduction: sweep
  multi-epsilon et attaques furtives. Ces runs ne doivent jamais etre melanges
  aux tableaux de reproduction du rapport.
expected_runs: 96

scenarios:
  - id: extension_multi_epsilon
    seeds: [28, 36, 54]
    base_config: &mnist_dp_base
      device: cpu
      data:
        dataset: mnist
        partition: dirichlet
        alpha: 0.1
        partition_policy: shared_across_training_seeds
        partition_seed: 28
        data_root: ./data
      model:
        architecture: lenet5
      training:
        num_rounds: 40
        cost_model: measured
        algo_config:
          lr: 0.01
          momentum: 0.0
          weight_decay: 0.0
          local_epochs: 2
          batch_size: 64
          client_metrics_every: 2
          fairness_tail_fraction: 0.2
      clients:
        num_clients: 10
        sample_fraction: 1.0
        sampling_strategy: random
        min_clients: 10
        fleet:
          - type: raspberry_pi_4
            count: 10
        battery_init:
          distribution: uniform_soc
          params: {min_soc: 0.95, max_soc: 0.95}
      eval:
        eval_every: 2
        honest_clients_only: true
        metrics:
          - test_accuracy
          - honest_client_accuracy_variance
          - honest_client_worst_20_accuracy
          - honest_client_best_worst_gap
          - byzantine_weight_mass
          - privacy_epsilon_max
          - privacy_delta
          - privacy_best_order_mean
          - joules_to_accuracy
          - bytes_to_accuracy
    conditions:
      - &epsilon_1
        id: epsilon_1
        privacy:
          model: local_or_central_dp_by_method
          target_epsilon: 1.0
          delta: 1.0e-5
          adjacency: declared_by_method
          accountant: rdp
          calibration_required: true
        algo_config: &epsilon_1_config
          target_epsilon: 1.0
          delta: 1.0e-5
          clip_norm: 1.0
        attacks: &no_attack
          - id: none
            config: null
        methods: &paper_dp_methods
          - id: dp_fedavg
            algorithm: dpfedavg
            requires: [target_epsilon_calibration, per_example_dpsgd]
          - id: dp_qffl_q1
            algorithm: dpqffl
            requires:
              - target_epsilon_calibration
              - per_example_dpsgd
              - private_loss_channel
            algo_config:
              q: 1.0
              lipschitz: 100.0
          - id: dp_far_alpha_0p1
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              far_alpha: 0.1
              robust_reference: cm_nnm
              num_byzantine: 2
          - id: fedfdp
            algorithm: fedfdp
            requires: [target_epsilon_calibration, private_loss_channel]
            algo_config:
              fairness_lambda: 0.1
              loss_clip: 2.5
              adaptive_loss_clip: false
          - id: sc_partial_far_dp
            algorithm: sc_partial_far_dp
            requires:
              - target_epsilon_calibration
              - user_level_clipping
              - partial_training
              - sensitivity_control
            algo_config: &sc_partial_common
              far_alpha: 0.1
              kappa_w: 5.0
              distance_clip: 1.0
              robust_reference: cm_nnm
              num_byzantine: 2
              num_layer_groups: 4
              # Public cyclic schedule: every group is visited once per cycle.
              layer_selection: sequential
              group_schedule_semantics: public_cycle_without_replacement
              sensitivity_mode: conservative_2C
      - id: epsilon_2
        privacy:
          model: local_or_central_dp_by_method
          target_epsilon: 2.0
          delta: 1.0e-5
          adjacency: declared_by_method
          accountant: rdp
          calibration_required: true
        algo_config:
          <<: *epsilon_1_config
          target_epsilon: 2.0
        attacks: *no_attack
        methods: *paper_dp_methods
      - id: epsilon_3
        privacy:
          model: local_or_central_dp_by_method
          target_epsilon: 3.0
          delta: 1.0e-5
          adjacency: declared_by_method
          accountant: rdp
          calibration_required: true
        algo_config:
          <<: *epsilon_1_config
          target_epsilon: 3.0
        attacks: *no_attack
        methods: *paper_dp_methods
      - id: epsilon_4
        privacy:
          model: local_or_central_dp_by_method
          target_epsilon: 4.0
          delta: 1.0e-5
          adjacency: declared_by_method
          accountant: rdp
          calibration_required: true
        algo_config:
          <<: *epsilon_1_config
          target_epsilon: 4.0
        attacks: *no_attack
        methods: *paper_dp_methods

  - id: extension_stealthy_attacks
    seeds: [28, 36, 54]
    base_config:
      device: cpu
      data:
        dataset: fashionmnist
        partition: dirichlet
        alpha: 0.1
        partition_policy: shared_across_training_seeds
        partition_seed: 28
        data_root: ./data
      model:
        architecture: lenet5
      training:
        num_rounds: 100
        cost_model: measured
        algo_config:
          lr: 0.01
          momentum: 0.0
          weight_decay: 0.0
          local_epochs: 1
          batch_size: 32
          client_metrics_every: 5
          fairness_tail_fraction: 0.2
      clients:
        num_clients: 25
        sample_fraction: 1.0
        sampling_strategy: random
        min_clients: 25
        fleet:
          - type: raspberry_pi_4
            count: 25
        battery_init:
          distribution: uniform_soc
          params: {min_soc: 0.95, max_soc: 0.95}
      eval:
        eval_every: 5
        honest_clients_only: true
        metrics:
          - test_accuracy
          - honest_client_accuracy_variance
          - honest_client_worst_20_accuracy
          - honest_client_best_worst_gap
          - byzantine_weight_mass
          - attack_cosine_to_honest_mean
          - privacy_epsilon_max
          - false_outlier_rate
    conditions:
      - id: epsilon_3
        privacy:
          model: local_or_central_dp_by_method
          target_epsilon: 3.0
          delta: 1.0e-5
          adjacency: declared_by_method
          accountant: rdp
          calibration_required: true
        algo_config:
          target_epsilon: 3.0
          delta: 1.0e-5
          clip_norm: 1.0
        attacks:
          - id: alie
            config: &stealth_attack_common
              enabled: true
              name: alie
              num_byzantine: 5
              client_ids: [0, 1, 2, 3, 4]
          - id: minmax
            config:
              <<: *stealth_attack_common
              name: minmax
              direction: negative_mean
              search_steps: 40
              max_scale: 10000.0
          - id: minsum
            config:
              <<: *stealth_attack_common
              name: minsum
              direction: negative_mean
              search_steps: 40
              max_scale: 10000.0
        methods:
          - id: far_non_private
            algorithm: far
            privacy_override:
              model: none
              target_epsilon: infinity
            algo_config:
              far_alpha: 0.1
              robust_reference: cm_nnm
              num_byzantine: 5
          - id: dp_far_alpha_0p1
            algorithm: dpfar
            requires: [target_epsilon_calibration, per_example_dpsgd]
            algo_config:
              far_alpha: 0.1
              robust_reference: cm_nnm
              num_byzantine: 5
          - id: fedfdp
            algorithm: fedfdp
            requires: [target_epsilon_calibration, private_loss_channel]
            algo_config:
              fairness_lambda: 0.1
              loss_clip: 2.5
              adaptive_loss_clip: false
          - id: sc_partial_far_dp
            algorithm: sc_partial_far_dp
            requires:
              - target_epsilon_calibration
              - user_level_clipping
              - partial_training
              - sensitivity_control
            algo_config:
              <<: *sc_partial_common
              num_byzantine: 5
