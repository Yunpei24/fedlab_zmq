schema_version: 1
lane: paper-grade
revision: fedfdp_negative_scale_ablation_v1
source: diagnostic_extension_of_internship_report_experiment_3
description: >-
  Paired FedFDP diagnostic at the R3 privacy budget. It preserves the balanced
  client-Dirichlet R3 protocol and compares the literal negative fair-scale
  policy (explicitly not DP-certified) with a non-negative clamp control.
  This lane measures negative loss deviations, negative raw/applied scales,
  contribution-norm violations and final utility. It must not be pooled with
  the historical R3 result table.
expected_runs: 6

scenarios:
  - id: exp3_fedfdp_negative_scale_ablation
    seeds: [28, 36, 54]
    base_config:
      device: cpu
      data:
        dataset: mnist
        partition: client_dirichlet_balanced
        alpha: 0.1
        partition_policy: shared_across_training_seeds
        partition_seed: 28
        data_root: ./data
      model:
        architecture: lenet5
      training:
        num_rounds: 40
        cost_model: measured
        algo_config:
          lr: 0.01
          momentum: 0.0
          weight_decay: 0.0
          local_epochs: 2
          batch_size: 64
          client_metrics_every: 2
          fairness_tail_fraction: 0.2
      clients:
        num_clients: 10
        sample_fraction: 1.0
        sampling_strategy: random
        min_clients: 10
        fleet:
          - type: raspberry_pi_4
            count: 10
        battery_init:
          distribution: uniform_soc
          params: {min_soc: 0.95, max_soc: 0.95}
      eval:
        eval_every: 2
        honest_clients_only: true
        metrics:
          - test_accuracy
          - honest_client_accuracy_mean
          - honest_client_accuracy_variance
          - honest_client_worst_20_accuracy
          - honest_client_best_20_accuracy
          - honest_client_best_worst_gap
          - fedfdp_balanced_fairness_psi
          - privacy_epsilon_max
          - privacy_delta
          - privacy_best_order_mean
          - privacy_model_noise_multiplier
          - privacy_loss_noise_multiplier
          - fedfdp_loss_deviation_negative_rate
          - fedfdp_raw_fair_scale_negative_rate
          - fedfdp_applied_scale_negative_rate
          - fedfdp_contribution_norm_violation_rate
          - fedfdp_raw_fair_scale_min
          - fedfdp_max_scaled_gradient_norm
          - fedfdp_norm_precondition_valid
    conditions:
      - id: epsilon_3p56
        privacy:
          model: local_dp
          target_epsilon: 3.56
          delta: 1.0e-5
          adjacency: record_replace_one
          accountant: rdp
          calibration_required: true
          certification_note: >-
            The nominal accountant is retained for paired noise calibration.
            It is not a valid certificate for allow_negative_uncertified.
        algo_config:
          target_epsilon: 3.56
          delta: 1.0e-5
          clip_norm: 1.0
        attacks:
          - id: none
            config: null
        methods:
          - id: fedfdp_raw_negative_uncertified
            algorithm: fedfdp
            requires: [target_epsilon_calibration, private_loss_channel]
            algo_config: &fedfdp_common
              fairness_lambda: 0.1
              loss_clip: 2.5
              adaptive_loss_clip: false
              loss_noise_calibration: compose_with_model_channel
              fair_scale_policy: allow_negative_uncertified
          - id: fedfdp_clamp_nonnegative_control
            algorithm: fedfdp
            requires: [target_epsilon_calibration, private_loss_channel]
            algo_config:
              <<: *fedfdp_common
              fair_scale_policy: clip_nonnegative
