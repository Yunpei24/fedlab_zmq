schema_version: 1
matrix_id: s0_step1h_fmnist_masked_dpfedavg_eps10_screen
common: common.yaml
description: >-
  Matched central-DP FedAvg screen for the three public static masks promoted
  by Step 1G. Each mask is evaluated with server clipping alone and with the
  same epsilon=10 Gaussian mechanism. The clipping threshold C=1.4, horizon,
  clients, partition and random seeds are fixed across arms. Full-update
  controls are reused from Step 1F rather than rerun.

common_overrides:
  protocol_id: scfar_dp_effective_private_dimension_dpfedavg_v1
  execution_scope: public_static_parameter_mask_dpfedavg_screen
  description: >-
    Development screen isolating the effect of public active-update dimension
    on central user-level DP-FedAvg. It is not a paper-1 full-update result.
  invariants:
    parameter_mask_selection: public_architecture_only
    frozen_coordinates_depend_on_private_data: false
    frozen_coordinates_transmitted: false
    frozen_coordinates_noised: false
    shared_user_clip_norm_across_masks: 1.4
  base_config:
    training:
      num_rounds: 40
      algo_config:
        privacy_num_rounds: 40
        user_clip_norm: 1.4
  methods:
    dpfedavg_mask_classifier_head:
      algorithm: scfar_dp
      role: masked_central_user_level_dp_fedavg
      tilt_policy: fixed
      algo_config:
        active_parameter_mode: classifier_head
        scfar_aggregation_rule: uniform
        far_alpha: 0.0
        kappa_w: 1.0
        sensitivity_mode: automatic_certified
    dpfedavg_mask_classifier_tail:
      algorithm: scfar_dp
      role: masked_central_user_level_dp_fedavg
      tilt_policy: fixed
      algo_config:
        active_parameter_mode: classifier_tail
        scfar_aggregation_rule: uniform
        far_alpha: 0.0
        kappa_w: 1.0
        sensitivity_mode: automatic_certified
    dpfedavg_mask_last_layer:
      algorithm: scfar_dp
      role: masked_central_user_level_dp_fedavg
      tilt_policy: fixed
      algo_config:
        active_parameter_mode: last_layer
        scfar_aggregation_rule: uniform
        far_alpha: 0.0
        kappa_w: 1.0
        sensitivity_mode: automatic_certified

preregistration:
  upstream_selection:
    source: results/scfar_paper1_fmnist_step1g_effective_dimension_v1/selection.json
    promoted_modes: [classifier_head, classifier_tail, last_layer]
    excluded_modes: [bias_only]
  primary_question: >-
    At fixed sensitivity bound and privacy budget, can reducing only the number
    of released coordinates make central user-level DP-FedAvg usable?
  paired_controls: [no_dp_clipped, eps10]
  development_seed_only: {partition_seed: 101, training_seed: 28}
  horizon_rounds: 40
  public_constants:
    user_clip_norm: 1.4
    epsilon: 10.0
    delta: 0.00001
  feasibility_gate:
    final_test_accuracy_min: 0.50
    final_worst20_accuracy_min: 0.20
    median_noise_to_clean_aggregate_ratio_max: 20.0
  sequential_rule: >-
    Only a mask whose eps10 arm passes every feasibility gate may proceed to
    lower epsilon values and three-seed confirmation. No mask is selected from
    a lower-epsilon result after observing final accuracy.

experiments:
  - id: step1h_classifier_head
    expected_tasks: 2
    scenario_ids: [fmnist_lenet5_b01]
    method_ids: [dpfedavg_mask_classifier_head]
    reference_ids: [fcc]
    anchor_ids: [previous_release]
    threat_ids: [clean]
    tilt_ids: [uniform_k1]
    privacy_ids: [no_dp, eps10]
    tau_over_c: [1.0]
    user_clip_norms: [1.4]
    seed_pairs:
      - {partition_seed: 101, training_seed: 28}
  - id: step1h_classifier_tail
    expected_tasks: 2
    scenario_ids: [fmnist_lenet5_b01]
    method_ids: [dpfedavg_mask_classifier_tail]
    reference_ids: [fcc]
    anchor_ids: [previous_release]
    threat_ids: [clean]
    tilt_ids: [uniform_k1]
    privacy_ids: [no_dp, eps10]
    tau_over_c: [1.0]
    user_clip_norms: [1.4]
    seed_pairs:
      - {partition_seed: 101, training_seed: 28}
  - id: step1h_last_layer
    expected_tasks: 2
    scenario_ids: [fmnist_lenet5_b01]
    method_ids: [dpfedavg_mask_last_layer]
    reference_ids: [fcc]
    anchor_ids: [previous_release]
    threat_ids: [clean]
    tilt_ids: [uniform_k1]
    privacy_ids: [no_dp, eps10]
    tau_over_c: [1.0]
    user_clip_norms: [1.4]
    seed_pairs:
      - {partition_seed: 101, training_seed: 28}
