  ipm_b5_weak:
    num_byzantine: 5
    attack: {enabled: true, name: ipm, scale: 0.5, num_byzantine: 5, client_ids: [20, 21, 22, 23, 24]}
  ipm_b5_strong:
    num_byzantine: 5
    attack: {enabled: true, name: ipm, scale: 2.0, num_byzantine: 5, client_ids: [20, 21, 22, 23, 24]}
  alie_b5_weak:
    num_byzantine: 5
    attack: {enabled: true, name: alie, scale: 0.5, z: null, num_byzantine: 5, client_ids: [20, 21, 22, 23, 24]}
