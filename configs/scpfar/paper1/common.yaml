  minsum_b5_weak:
    num_byzantine: 5
    attack: {enabled: true, name: minsum, scale: 0.5, search_steps: 40, max_scale: 10000.0, direction: negative_mean, num_byzantine: 5, client_ids: [20, 21, 22, 23, 24]}

honest_outliers:
  rule: top_20_percent_honest_clients_by_js_label_divergence_before_training
  by_scenario_and_partition_seed:
    fmnist_lenet5_b01:
      101: [0, 4, 19, 16]
      102: [3, 18, 11, 13]
      103: [9, 3, 17, 4]
    cifar10_alexnet_b01:
      101: [0, 4, 19, 16]
      102: [3, 18, 11, 13]
      103: [9, 3, 17, 4]
    fmnist_lenet5_b05:
      101: [3, 14, 15, 18]
      102: [9, 11, 3, 15]
      103: [15, 8, 19, 6]
    cifar10_alexnet_b05:
      101: [3, 14, 15, 18]
      102: [9, 11, 3, 15]
