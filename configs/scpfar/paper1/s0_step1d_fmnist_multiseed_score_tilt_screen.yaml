    threat_ids: [clean]
    tilt_ids: [k2_r100, k5_r100]
    privacy_ids: [no_dp]
    tau_over_c: [1.0]
    user_clip_norms: [1.4]
    seed_pairs:
      - {partition_seed: 101, training_seed: 28}
