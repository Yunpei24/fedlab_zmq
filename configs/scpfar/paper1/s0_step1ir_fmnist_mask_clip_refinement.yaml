    sha256: 45b8568db2a6c049e4d9feab6207b9da24d929e5f2cdedfdaf14c47488b5d6c1
  development_seed_only:
    partition_seed: 104
    training_seed: 17
  horizon_rounds: 20
  public_grid:
    user_clip_norm_by_mode:
      classifier_tail: 1.631041
      last_layer: 2.654181
  feasibility_gate:
    final_test_accuracy_min: 0.5
    final_worst20_accuracy_min: 0.2
    median_user_clip_rate_min_exclusive: 0.05
    median_user_clip_rate_max_exclusive: 0.95
    selection: smallest_C_passing_all_gates_per_mask
  selection_rule: A candidate is retained only if its validation run passes all utility and
    clipping-health gates.
