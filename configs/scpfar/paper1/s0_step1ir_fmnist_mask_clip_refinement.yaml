schema_version: 1
matrix_id: s0_step1ir_fmnist_mask_clip_refinement
common: common.yaml
description: One deterministic validation run per active mask. C is the median over rounds
  of the per-round median pre-clipping update norm measured by the essentially-unclipped Step
  1I probe.
common_overrides:
  protocol_id: scfar_dp_mask_clip_refinement_v1
  execution_scope: public_static_parameter_mask_clip_refinement
  invariants:
    parameter_mask_selection: public_architecture_only
    candidate_selection_source: results/scfar_paper1_fmnist_step1i_mask_clip_calibration_v1/selection.json
    candidate_selection_sha256: 45b8568db2a6c049e4d9feab6207b9da24d929e5f2cdedfdaf14c47488b5d6c1
    candidate_statistic: median_t_of_preclip_norm_p50_i
    frozen_coordinates_depend_on_private_data: false
    frozen_coordinates_transmitted: false
    frozen_coordinates_noised: false
  base_config:
    training:
      num_rounds: 20
      algo_config:
        privacy_num_rounds: 20
  methods:
    clipref_mask_classifier_tail:
      algorithm: scfar_dp
      role: masked_nodp_quantile_clip_refinement
      tilt_policy: fixed
      algo_config:
        active_parameter_mode: classifier_tail
        scfar_aggregation_rule: uniform
        far_alpha: 0.0
        kappa_w: 1.0
        sensitivity_mode: automatic_certified
    clipref_mask_last_layer:
      algorithm: scfar_dp
      role: masked_nodp_quantile_clip_refinement
      tilt_policy: fixed
      algo_config:
        active_parameter_mode: last_layer
        scfar_aggregation_rule: uniform
        far_alpha: 0.0
        kappa_w: 1.0
        sensitivity_mode: automatic_certified
preregistration:
  upstream_selection:
