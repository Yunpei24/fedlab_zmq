# ============================================================
# FedPartBE Sensitivity: Non-IID level (Dirichlet alpha)
# Runs fedpart_be + fedpart for alpha in {0.1, 0.5, 1.0}
# Shows: FedPartBE is robust to heterogeneity level
# ============================================================
# Launch separately for each alpha:
#   python run_experiment.py --config configs/fedpartbe_sensitivity_alpha.yaml \
#       --algo fedpart_be --alpha 0.1 --output results/sensitivity_alpha_01
#   python run_experiment.py --config configs/fedpartbe_sensitivity_alpha.yaml \
#       --algo fedpart_be --alpha 0.5 --output results/sensitivity_alpha_05
#   python run_experiment.py --config configs/fedpartbe_sensitivity_alpha.yaml \
#       --algo fedpart_be --alpha 1.0 --output results/sensitivity_alpha_10
# (or use the HPC array job below)
# ============================================================

seed: 42
output_dir: "./results/fedpartbe_sensitivity_alpha"

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 0.3           # overridden per job in HPC array
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedpart_be
  algo_config:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    warmup_rounds: 5
    num_tiers: 3
    mu_repr: 0.1
    mu_weight: 0.01
    energy_scale_factor: 44.0

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 5

  fleet:
    - type: raspberry_pi_4
      count: 8
    - type: smartphone_midrange
      count: 10
    - type: jetson_nano
      count: 5
    - type: esp32_s3
      count: 7

  battery_init:
    distribution: weibull_soc
    params:
      kappa: 2.0
      lambda_soc: 0.7
      min_soc: 0.05
      max_soc: 0.95
