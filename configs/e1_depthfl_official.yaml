# =====================================================================
# E1-DepthFL-OFFICIEL — Kim et al., ICLR 2023, porté dans le harnais.
# Mécanique fidèle: CE de toutes les têtes <= d + distillation MUTUELLE
# (Eq. 1, tau=1), niveaux statiques répartis uniformément (papier),
# agrégation par couverture de profondeur, INFÉRENCE PAR ENSEMBLE
# (model resnet8_ee_ens => l'éval standard mesure l'ensemble, comme le
# papier). feddyn_alpha=0 => variante DepthFL(FedAvg)+SD, iso-optimiseur
# avec nos runs E1 (adam 3e-3, 8 epochs). Battery-blind: paie phi_d*F
# chaque round, meurt à batterie vide. Setup = E1 (40x RPi-4, seed 42).
# =====================================================================

clients:
  battery_init:
    distribution: uniform_soc
    params:
      max_soc: 0.55
      min_soc: 0.05
  fleet:
  - count: 40
    type: raspberry_pi_4
  min_clients: 1
  num_clients: 40
  sample_fraction: 1.0
  sampling_strategy: random
cost_model: measured
data:
  alpha: 1.0
  data_root: ./data
  dataset: cifar10
  model: resnet8_ee_ens
  partition: dirichlet
device: mps
layer_mismatch: false
model:
  architecture: resnet8_ee_ens
output_dir: ./results/E1_depthfl_official
seed: 42
training:
  algo_config:
    optimizer: adam
    lr: 0.003
    local_epochs: 8
    batch_size: 32
    weight_decay: 0.0001
    momentum: 0.9
    max_grad_norm: 10.0
    energy_scale_factor: 3.0
    alpha_applies_to: compute
    level_assign: uniform
    feddyn_alpha: 0.0
  algorithm: depthfl
  num_rounds: 200
