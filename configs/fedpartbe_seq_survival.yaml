# ============================================================
# FedPartBE — Sequential Mode (FedPartBESeq), Narrow SOC [5%, 15%]
# ============================================================
# Scénario identique à fedpartbe_survival.yaml mais avec
# group_selection: "sequential" (sliding window).
#
# Usage
# ─────
#   python run_experiment.py --config configs/fedpartbe_seq_survival.yaml --device mps
# ============================================================

seed: 42
output_dir: "./results/fedpartbe_seq_survival"
layer_mismatch: false
device: mps

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 0.5
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedpart_be
  algo_config:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    warmup_rounds: 5
    num_tiers: 2
    server_lr: null            # auto = 1/num_tiers = 0.5
    mu_repr: 3.8
    mu_weight: 3.7

    # ── Sequential group selection ──────────────────────────────────────────
    group_selection: sequential   # "staleness_aware" | "sequential"
    window_step: 0                # 0=auto(=num_tiers=2)
    assignment_strategy: quantile
    rotation_period: 0            # ignoré en mode sequential
    # ───────────────────────────────────────────────────────────────────────

    verbose_groups: false
    inter_cycle_rounds: 0
    energy_scale_factor: 12.6
    ema_alpha: 0.3

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 5

  fleet:
    - type: esp32_s3
      count: 30

  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.15
