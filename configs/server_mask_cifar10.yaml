# ============================================================
# Server-Mask FL — Battery-Adaptive Parameter-Level Masking
# ============================================================
# Scenario: 30 ESP32-S3 devices with heterogeneous battery levels,
# representing a continuous IoT fleet (some recently charged, others
# nearly depleted).
#
# Algorithm: Server-Mask FL
# --------------------------
# Instead of assigning layer groups (FedPartBE), the server computes a
# personalized parameter-level mask for each client based on gradient
# importance history (EMA). Low-battery clients train fewer parameter
# tensors (small β_k), high-battery clients train more (large β_k).
#
# Key features:
#   - Fine-grained masks: parameter tensors (conv1.weight, bn1.bias, etc.)
#   - Continuous β_k from battery: β_k ∈ [β_min, β_max]
#   - Gradient importance: EMA of |∇w_k|² per tensor per client
#   - ε-greedy exploration: prevent tensor starvation
#   - Sparse aggregation: each client updates different tensors
#
# Why this scenario is ideal for Server-Mask FL
# ----------------------------------------------
# With battery spread SOC [5%, 95%] (spread = 19×):
#   - FedAvg: low-SOC clients die fast during warmup (~round 30)
#   - FedPartBE: discrete tiers → coarse adaptation
#   - Server-Mask FL: continuous β_k → fine-grained adaptation
#     - Client at 5% SOC → β_k ≈ 0.1 → trains ~10% of tensors
#     - Client at 95% SOC → β_k ≈ 1.0 → trains full model
#     - Gradient importance ensures most informative tensors trained first
#     - All clients survive longer → better data coverage
#
# Expected performance (seed=42)
# ------------------------------
#   FedAvg:           Best ~70%, all dead ~round 30
#   FedPartBE:        Best ~62-65%, 50% dropout ~round 50
#   Server-Mask FL:   Best ~65-68%, 50% dropout ~round 55-60
#                     (better than FedPartBE due to finer masks)
#
# Usage
# -----
#   python run_experiment.py --config configs/server_mask_cifar10.yaml --device mps
# ============================================================

seed: 42
output_dir: "./results/server_mask/server_mask_e8"
device: mps

layer_mismatch: false
layer_mismatch_config:
  freq: 5
  layers: null
  metrics: [cka]
  max_batches_per_client: 1
  max_clients_cka: 4

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 0.5
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: server_mask
  algo_config:
    optimizer: "adam"
    lr: 0.001
    momentum: 0.95
    weight_decay: 1.0e-4
    local_epochs: 5
    batch_size: 32
    warmup_rounds: 5
    beta_min: 0.05              # Lowest-battery clients train ~10% of param tensors
    beta_max: 0.35              # Highest-battery clients train ~50% (avg ≈ 30% ≈ FedPartBE 1/3)
    ema_alpha: 0.3             # Importance score EMA decay
    epsilon_explore: 0.05      # Exploration fraction (ε-greedy)
    battery_max_j: null        # Auto-calibrated from fleet at round 0
    server_lr: 0.5             # Scale aggregated deltas — prevents divergence with sparse updates
    mu_weight: 0.0             # Disabled: server_lr=0.5 already limits drift; proximal adds 46k CUDA ops/round
    energy_scale_factor: 12.6  # Same calibration as FedPartBE for direct comparison
    max_grad_norm: 10.0        # Gradient clipping threshold
    device: mps
    device_profile: null

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 3

  fleet:
    - type: esp32_s3
      count: 30

  # Battery initialization: uniform SOC in [5%, 95%]
  # Represents heterogeneous fleet: recently charged (95% SOC = 3515J)
  # vs nearly depleted (5% SOC = 185J). Spread = 19× → ideal for
  # battery-adaptive algorithms.
  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.95
