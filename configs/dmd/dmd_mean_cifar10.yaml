# Native DMD-CB configuration for run_experiment.py.
seed: 42
output_dir: ./results/dmd/dmd_mean_cifar10
device: mps
cost_model: measured
layer_mismatch: false

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 0.3
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 150
  algorithm: dmd_mean
  algo_config:
    lr: 0.03
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 1
    batch_size: 64
    num_classes: 10
    mean_mu: 0.1875
    dispersion_mu: 0.0
    cvar_tail_mass: 0.2
    class_weight_mode: uniform
    reference_mode: fixed_zero
    reference_method: median
    min_reference_clients: 3
    context_policy: one_round_stale
    warmup_rounds: 2
    anchor_fraction: 0.2
    anchor_batch_size: 256
    max_train_samples: 500
    max_anchor_samples: 150
    min_train_samples: 50
    require_anchor_dataloader: true
    client_metrics_every: 5
    device: mps
    device_profile: null

clients:
  num_clients: 10
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 10
  fleet:
    - type: raspberry_pi_4
      count: 10
