# DMD-Tail/CVaR companion to dmd_mean_cifar10.yaml; full participation is
# intentional for the initial mechanism-isolation study, not a robustness claim.
# ``seed`` controls training; ``data.partition_seed`` controls client shards.
seed: 42
output_dir: ./results/dmd/dmd_tail_cifar10
device: mps
cost_model: measured
layer_mismatch: false
data: {dataset: cifar10, model: resnet8, partition: dirichlet, partition_seed: 101, alpha: 0.3, data_root: ./data}
model: {architecture: resnet8}
training:
  num_rounds: 150
  algorithm: dmd_tail
  algo_config:
    lr: 0.03
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 1
    batch_size: 64
    num_classes: 10
    mean_mu: 0.15
    dispersion_mu: 0.0375
    cvar_tail_mass: 0.2
    class_weight_mode: uniform
    reference_method: median
    min_reference_clients: 2
    context_policy: one_round_stale
    device: mps
    device_profile: null
clients:
  num_clients: 10
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 10
  fleet: [{type: raspberry_pi_4, count: 10}]
