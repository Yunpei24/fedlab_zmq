# ──────────────────────────────────────────────────────────────────
# SECTION 6 — Backward-compatible flat fields (run_experiment.py)
# ──────────────────────────────────────────────────────────────────
# run_experiment.py reads only the keys below (seed, output_dir, device,
# layer_mismatch*, data, model, training, clients). The sections above
# (global, hpc, fleets, algo_defaults, experiments) are ignored by it.
# These flat fields correspond to the main FedStep benchmark experiment.
# ──────────────────────────────────────────────────────────────────
seed: 42
output_dir: "./results/fedpartbe_wide"
device: cpu

layer_mismatch: false
layer_mismatch_config:
  freq: 5
  layers: null
  metrics: [cka]
  max_batches_per_client: 1
  max_clients_cka: 4

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 1
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedstep
  algo_config:
    optimizer: "adam"
    lr: 0.001
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    warmup_rounds: 5
    num_tiers: 4
    server_lr: 0.3
    assignment_strategy: quantile
    # group_selection: sequential
    # window_step: 4
    mu_repr: 0.01
    mu_weight: 0.0
    ema_model_alpha: 0.0
    rotation_period: 4
    adaptive_rotation: false
    inter_cycle_rounds: 0
    energy_scale_factor: 10
    max_grad_norm: 10.0
    ema_alpha: 0.3
    persist_optimizer: false
    verbose_groups: false
    enforce_staleness_cap: false

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 3 # minimum number of clients required for training

  fleet:
    - type: esp32_s3
      count: 30

  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.95
