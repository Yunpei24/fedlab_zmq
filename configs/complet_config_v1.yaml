# ===================================================================
# FedStep — Complete Paper Experiments Master Configuration
# ===================================================================
# Paper: "FedStep: Battery-Energy Aware Partial Network Training
#         for Federated Learning" (Nikiema & Amhoud, 2026)
#
# ── Execution modes ─────────────────────────────────────────────────
# 1. Single-process (local dev / laptop):
#      python run_experiment.py --config configs/fedpartbe_survival_wide_cifar10.yaml
#    → Uses the flat fields at the bottom of this file (seed, data, training, clients)
#    → Runs ONE experiment defined by training.algorithm + training.algo_config
#
# 2. ZMQ distributed (UM6P HPC / SLURM):
#      python hpc/launch_zmq_hpc.py --mode slurm [--group benchmark]
#    → Parses the `experiments:` section
#    → Submits one SLURM job per experiment × seed
#    → Each job: ZMQ server + N workers as parallel OS processes on ONE node
#    → Workers communicate via tcp://127.0.0.1:ROUTER_PORT (real ZMQ sockets)
#
# ── Experiment groups ────────────────────────────────────────────────
#   benchmark      → Table 1: FedStep vs baselines
#   ablation       → Table 3: component ablation
#   sensitivity    → Figures 4–5: M and α sweeps
#   dataset        → Table 4: CIFAR-100, TinyImageNet, MobileNetV2
#   fleet          → Section 6.4: heterogeneous multi-device fleets
#   reproducibility→ Appendix: 3-seed variance (normally covered by benchmark)
# ===================================================================


# ──────────────────────────────────────────────────────────────────
# SECTION 1 — Global defaults (shared by all experiments)
# ──────────────────────────────────────────────────────────────────
global:
  seed: 42
  device: cpu              # HPC: cpu; local GPU: cuda or mps
  data_root: ./data        # HPC: /scratch/$USER/fedpartbe_data
  output_base: ./results_hpc
  num_rounds: 200


# ──────────────────────────────────────────────────────────────────
# SECTION 2 — HPC / SLURM configuration
# ──────────────────────────────────────────────────────────────────
hpc:
  launcher: zmq            # "zmq" = real distributed; "single_process" = run_experiment.py
  python: python3          # adjust to: /path/to/conda/envs/fedlab/bin/python

  slurm:
    partition: gpu          # UM6P HPC partition name
    account: um6p_fl        # your SLURM account
    mem_total: 64G          # memory per node (server + N workers)
    log_dir: ./logs
    # Per-group wall-clock limits
    time_benchmark:     "10:00:00"
    time_ablation:      "05:00:00"
    time_sensitivity:   "05:00:00"
    time_dataset:       "14:00:00"
    time_fleet:         "12:00:00"
    time_reproducibility: "10:00:00"

  zmq:
    router_port: 5555       # DEALER→ROUTER (client updates to server)
    pub_port: 5556          # PUB→SUB    (server broadcasts to clients)
    round_timeout_s: 900    # 15-min timeout per round
    server_start_delay_s: 3 # wait for server sockets to bind before workers connect


# ──────────────────────────────────────────────────────────────────
# SECTION 3 — Fleet definitions
# ──────────────────────────────────────────────────────────────────
# Available device profile keys (hardware/profiles.py):
#   esp32_s3             Xtensa LX7 @ 240 MHz | 1000 mAh/3.7 V = 13,320 J total
#   raspberry_pi_zero2w  Cortex-A53 @ 1.0 GHz | 3000 mAh/5.0 V = 54,000 J total
#   raspberry_pi_4       Cortex-A72 @ 1.5 GHz | 10 Ah/5.1 V  = 183,600 J total
#   smartphone_midrange  Exynos 1380 @ 2.0 GHz | 5000 mAh/3.85 V = 69,300 J total
#   jetson_nano          Maxwell GPU + A57     | 20 Ah/5.0 V  = 360,000 J total
#
# battery_init distributions (per device group):
#   uniform_soc   SOC ~ Uniform(min_soc, max_soc)
#   weibull_soc   SOC ~ Weibull(kappa, lambda_soc), clipped to [min_soc, max_soc]
#   gaussian      SOC = profile.initial_soc + N(0, std)
#
# For ZMQ mode: hpc/launch_zmq_hpc.py pre-samples SOC values and passes them
# to the server via FEDLAB_CLIENT_BATTERIES (JSON map: client_id → battery_j).
# ──────────────────────────────────────────────────────────────────
fleets:

  # ── 30 ESP32-S3 (homogeneous — paper main setup) ──────────────
  # SOC spread 19× → optimal for proportional tier assignment
  esp32_30:
    num_clients: 30
    composition:
      - {device: esp32_s3, count: 30}
    battery_init:
      distribution: uniform_soc
      params: {min_soc: 0.05, max_soc: 0.95}
    # Reference energies:
    #   min_j  = 0.05 × 13320 =   666 J → dies round ~5–10 under FedAvg
    #   mean_j = 0.50 × 13320 = 6,660 J → T* = 6660 / (2.33 × 12.6) ≈ 227 rounds
    #   max_j  = 0.95 × 13320 = 12,654 J

  # ── 60-client heterogeneous fleet ─────────────────────────────
  # 4 device types spanning 3 orders of magnitude in energy
  mixed_60:
    num_clients: 60
    composition:
      - {device: esp32_s3,            count: 20}  # clients  0–19  (IoT sensors)
      - {device: raspberry_pi_zero2w, count: 15}  # clients 20–34  (constrained edge)
      - {device: raspberry_pi_4,      count: 15}  # clients 35–49  (mid-range edge)
      - {device: smartphone_midrange, count: 10}  # clients 50–59  (mobile users)
    # Per-device SOC distributions (heterogeneous charging patterns)
    battery_init_by_device:
      esp32_s3:
        distribution: uniform_soc
        params: {min_soc: 0.05, max_soc: 0.95}   # severe spread: 19×
      raspberry_pi_zero2w:
        distribution: uniform_soc
        params: {min_soc: 0.15, max_soc: 0.90}   # spread: 6×
      raspberry_pi_4:
        distribution: uniform_soc
        params: {min_soc: 0.20, max_soc: 0.90}   # spread: 4.5×
      smartphone_midrange:
        distribution: weibull_soc
        params: {kappa: 2.0, lambda_soc: 0.55, min_soc: 0.20, max_soc: 0.85}
    # Fallback for run_experiment.py (single distribution over all 60 clients)
    battery_init:
      distribution: uniform_soc
      params: {min_soc: 0.05, max_soc: 0.95}

  # ── 100-client full heterogeneous fleet ───────────────────────
  # 5 device types: sensors → constrained edge → servers → mobile → AI edge
  mixed_100:
    num_clients: 100
    composition:
      - {device: esp32_s3,            count: 30}  # clients   0–29
      - {device: raspberry_pi_zero2w, count: 20}  # clients  30–49
      - {device: raspberry_pi_4,      count: 25}  # clients  50–74
      - {device: smartphone_midrange, count: 15}  # clients  75–89
      - {device: jetson_nano,         count: 10}  # clients  90–99
    battery_init_by_device:
      esp32_s3:
        distribution: uniform_soc
        params: {min_soc: 0.05, max_soc: 0.95}
      raspberry_pi_zero2w:
        distribution: uniform_soc
        params: {min_soc: 0.10, max_soc: 0.90}
      raspberry_pi_4:
        distribution: uniform_soc
        params: {min_soc: 0.20, max_soc: 0.85}
      smartphone_midrange:
        distribution: weibull_soc
        params: {kappa: 2.0, lambda_soc: 0.55, min_soc: 0.20, max_soc: 0.80}
      jetson_nano:
        distribution: uniform_soc
        params: {min_soc: 0.40, max_soc: 0.95}  # AI edge nodes typically well-charged
    battery_init:
      distribution: uniform_soc
      params: {min_soc: 0.05, max_soc: 0.95}


# ──────────────────────────────────────────────────────────────────
# SECTION 4 — Algorithm hyperparameter defaults
# ──────────────────────────────────────────────────────────────────
# Each experiment's algo_config_overrides dict patches specific keys.
# Unspecified keys fall back to these defaults.
# ──────────────────────────────────────────────────────────────────
algo_defaults:

  fedstep:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    # Tier structure
    num_tiers: 4            # M=4 — optimal for G=10 layer groups, τ_max=2 (Theorem 1)
    server_lr: null         # null → auto = 1/M = 0.25 (damped aggregation)
    assignment_strategy: quantile  # battery quantile → tier mapping
    # Warmup: full-model FedAvg rounds before PNU partial training begins
    warmup_rounds: 5
    # Representation proximal term (Eq. 6 in paper)
    mu_repr: 0.01
    mu_weight: 0.0
    # Bucket rotation: T_rot=4 → full cycle = M × T_rot = 16 rounds
    rotation_period: 4
    adaptive_rotation: false
    inter_cycle_rounds: 0
    # Energy model
    energy_scale_factor: 12.6
    # Gradient clipping
    max_grad_norm: 12.0
    # EMA parameters
    ema_model_alpha: 0.0    # model weight EMA (0 = disabled)
    ema_alpha: 0.3          # per-group cost EMA
    persist_optimizer: false
    verbose_groups: false

  fedavg:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    energy_scale_factor: 12.6
    max_grad_norm: 12.0

  fedpart:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    warmup_rounds: 5
    num_tiers: 4
    server_lr: null
    assignment_strategy: quantile
    rotation_period: 4
    energy_scale_factor: 12.6
    max_grad_norm: 12.0
    ema_alpha: 0.3

  leanfed:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    beta_min: 0.01
    beta_max: 1.0
    battery_max_j: 13320.0
    energy_scale_factor: 12.6
    max_grad_norm: 12.0

  fedbacys:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    energy_scale_factor: 12.6
    max_grad_norm: 12.0

  eceffl:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    beta_min: 0.01
    beta_max: 1.0
    battery_max_j: 13320.0
    energy_scale_factor: 12.6
    max_grad_norm: 12.0

  fedsparq:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 8
    batch_size: 32
    energy_scale_factor: 12.6
    max_grad_norm: 12.0


# ──────────────────────────────────────────────────────────────────
# SECTION 5 — Experiment suite
# ──────────────────────────────────────────────────────────────────
# Fields per experiment:
#   name                  unique job ID → output subdir + SLURM job name
#   group                 category (see header)
#   description           human-readable label
#   enabled               false = skip without deleting the entry
#   seeds                 list of RNG seeds (one SLURM job per seed)
#   fleet                 key into fleets: section above
#   data                  dataset / model / partition / alpha
#   training.num_rounds   override global.num_rounds if needed
#   training.algorithm    algorithm registry key
#   algo_config_overrides dict patching algo_defaults.<algorithm>
# ──────────────────────────────────────────────────────────────────
experiments:


  # ══════════════════════════════════════════════════════════════
  # GROUP — benchmark (Table 1)
  # Setup: CIFAR-10, ResNet-8, 30 ESP32-S3, Dirichlet α=0.5, 200 rounds
  # Expected: FedStep acc≈63.24% | 19/30 alive | Jain 0.63 | −10.3% comm
  # ══════════════════════════════════════════════════════════════

  - name: benchmark_fedpartbe
    group: benchmark
    description: "FedStep M=4 — main result, 3 seeds"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {}

  - name: benchmark_fedavg
    group: benchmark
    description: "FedAvg — full-model baseline, no energy awareness"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedavg}
    algo_config_overrides: {}

  - name: benchmark_fedpart_m2
    group: benchmark
    description: "FedPart M=2 — partial training, no battery awareness"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedpart}
    algo_config_overrides: {num_tiers: 2}

  - name: benchmark_fedpart_m4
    group: benchmark
    description: "FedPart M=4 — same tier count as FedStep (fair comparison)"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedpart}
    algo_config_overrides: {num_tiers: 4}

  - name: benchmark_leanfed
    group: benchmark
    description: "LeanFed (Pereira et al., 2025)"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: leanfed}
    algo_config_overrides: {}

  - name: benchmark_eceffl
    group: benchmark
    description: "E-CEFFL (Nikiema & Amhoud, 2025)"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: eceffl}
    algo_config_overrides: {}

  - name: benchmark_fedbacys
    group: benchmark
    description: "FedBaCyS baseline"
    enabled: true
    seeds: [42, 123, 2025]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedbacys}
    algo_config_overrides: {}


  # ══════════════════════════════════════════════════════════════
  # GROUP — ablation (Table 3)
  # Remove each FedStep component one at a time; seed=42 only
  # ══════════════════════════════════════════════════════════════

  - name: ablation_no_repr_proximal
    group: ablation
    description: "No representation proximal: μ_repr=0, μ_weight=0"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides:
      mu_repr: 0.0
      mu_weight: 0.0

  - name: ablation_single_tier
    group: ablation
    description: "Single tier M=1 (degenerates to unweighted partial training)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides:
      num_tiers: 1
      server_lr: 1.0

  - name: ablation_no_staleness_priority
    group: ablation
    description: "Round-robin tier assignment (no staleness-aware priority scheduler)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides:
      assignment_strategy: round_robin

  - name: ablation_no_server_damping
    group: ablation
    description: "No server damping: server_lr=1.0 instead of 1/M=0.25"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides:
      server_lr: 1.0

  - name: ablation_no_rotation
    group: ablation
    description: "No bucket rotation: rotation_period=0 → gradient starvation per layer"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides:
      rotation_period: 0

  - name: ablation_no_warmup
    group: ablation
    description: "No warmup rounds: partial training from round 1"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides:
      warmup_rounds: 0


  # ══════════════════════════════════════════════════════════════
  # GROUP — sensitivity (Figures 4–5)
  # ══════════════════════════════════════════════════════════════

  # ── Sensitivity: number of tiers M (Figure 4) ──────────────
  - name: sensitivity_M1
    group: sensitivity
    description: "Tier sensitivity: M=1"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {num_tiers: 1, server_lr: 1.0}

  - name: sensitivity_M2
    group: sensitivity
    description: "Tier sensitivity: M=2"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {num_tiers: 2, server_lr: null}

  - name: sensitivity_M3
    group: sensitivity
    description: "Tier sensitivity: M=3"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {num_tiers: 3, server_lr: null}

  - name: sensitivity_M4
    group: sensitivity
    description: "Tier sensitivity: M=4 (same as main — reference point)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {num_tiers: 4, server_lr: null}

  - name: sensitivity_M5
    group: sensitivity
    description: "Tier sensitivity: M=5"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {num_tiers: 5, server_lr: null}

  - name: sensitivity_M6
    group: sensitivity
    description: "Tier sensitivity: M=6 (above optimal — expect degradation)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {num_tiers: 6, server_lr: null}

  # ── Sensitivity: Dirichlet α (Figure 5) ────────────────────
  - name: sensitivity_alpha_0_1
    group: sensitivity
    description: "Heterogeneity sensitivity: α=0.1 (strong non-IID)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.1}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {}

  - name: sensitivity_alpha_0_3
    group: sensitivity
    description: "Heterogeneity sensitivity: α=0.3 (moderate-strong)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.3}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {}

  - name: sensitivity_alpha_0_5
    group: sensitivity
    description: "Heterogeneity sensitivity: α=0.5 (paper default)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {}

  - name: sensitivity_alpha_1_0
    group: sensitivity
    description: "Heterogeneity sensitivity: α=1.0 (mild non-IID)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 1.0}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {}

  - name: sensitivity_alpha_iid
    group: sensitivity
    description: "Heterogeneity sensitivity: IID (upper bound)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: iid, alpha: 1.0}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {}

  # ── Sensitivity: rotation period T_rot ─────────────────────
  - name: sensitivity_Trot0
    group: sensitivity
    description: "Rotation sensitivity: T_rot=0 (disabled)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {rotation_period: 0}

  - name: sensitivity_Trot2
    group: sensitivity
    description: "Rotation sensitivity: T_rot=2"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {rotation_period: 2}

  - name: sensitivity_Trot4
    group: sensitivity
    description: "Rotation sensitivity: T_rot=4 (paper default)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {rotation_period: 4}

  - name: sensitivity_Trot8
    group: sensitivity
    description: "Rotation sensitivity: T_rot=8 (longer cycle)"
    enabled: true
    seeds: [42]
    fleet: esp32_30
    data: {dataset: cifar10, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 200, algorithm: fedstep}
    algo_config_overrides: {rotation_period: 8}


  # ══════════════════════════════════════════════════════════════
  # GROUP — dataset (Table 4)
  # Generalization to harder tasks and stronger models
  # ══════════════════════════════════════════════════════════════

  - name: cifar100_resnet8_fedpartbe
    group: dataset
    description: "CIFAR-100, ResNet-8 — FedStep (100-class task)"
    enabled: true
    seeds: [42, 123]
    fleet: esp32_30
    data: {dataset: cifar100, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 300, algorithm: fedstep}
    algo_config_overrides:
      lr: 0.01
      warmup_rounds: 10

  - name: cifar100_resnet8_fedavg
    group: dataset
    description: "CIFAR-100, ResNet-8 — FedAvg baseline"
    enabled: true
    seeds: [42, 123]
    fleet: esp32_30
    data: {dataset: cifar100, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 300, algorithm: fedavg}
    algo_config_overrides: {}

  - name: cifar100_resnet8_fedpart
    group: dataset
    description: "CIFAR-100, ResNet-8 — FedPart M=4 baseline"
    enabled: true
    seeds: [42, 123]
    fleet: esp32_30
    data: {dataset: cifar100, model: resnet8, partition: dirichlet, alpha: 0.5}
    training: {num_rounds: 300, algorithm: fedpart}
