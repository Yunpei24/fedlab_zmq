# =====================================================================
# E3 ablation 'no_rotation' — E1 base with rotation_period=0 (algo fedpart_be)
# Generated from configs/fedstep_e1_alpha1.yaml (frozen E1 base).
# Run via the matching scripts/run_eX.sh (3 algos x seeds {42,43,44}).
# =====================================================================

seed: 42
output_dir: "./results/E3/no_rotation"
device: mps
cost_model: measured          # honest accounting (FlopCounterMode)

layer_mismatch: false

data:
  dataset: cifar10
  model: resnet8
  partition: dirichlet
  alpha: 1.0                  # E1 headline heterogeneity (Dirichlet, NOT energy alpha)
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedpart_be
  algo_config:
    optimizer: adam
    lr: 0.003
    momentum: 0.9            # ignored if optimizer=adam
    weight_decay: 1.0e-4
    local_epochs: 8          # E1 protocol
    batch_size: 32
    warmup_rounds: 5         # minimal full-model warmup (warmup is the costly phase)
    num_tiers: 4
    server_lr: null
    assignment_strategy: quantile
    mu_repr: 0.01
    mu_weight: 0.0
    ema_model_alpha: 0.0
    rotation_period: 0
    adaptive_rotation: false
    inter_cycle_rounds: 0
    energy_scale_factor: 3.0  # raspberry_pi_4 physical alpha (~33% sustained util)
    alpha_applies_to: compute # "compute" | "total"
    max_grad_norm: 10.0
    ema_alpha: 0.3
    persist_optimizer: false
    enforce_staleness_cap: false

    # --- fed_resonance only (optional; else get_default_config defaults) ---
    rank_min: 4
    rank_max: 16
    spectral_energy_thresh: 0.75
    use_rsvd: true
    use_error_feedback: true
    svd_fast: true
    subspace_drift_thresh: 0.1
    rank_coherence_thresh: 0.7
    rsvd_oversample: 10
    rsvd_power_iter: 2

clients:
  num_clients: 40
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 1

  fleet:
    - type: raspberry_pi_4
      count: 40

  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.55
