# FedPart E1 (iso à la ligne s42 : algo_config du manifest récupéré,
# flotte/batteries/data du setup E1 standard). Pour seeds 43/44.
clients:
  battery_init:
    distribution: uniform_soc
    params:
      max_soc: 0.55
      min_soc: 0.05
  fleet:
  - count: 40
    type: raspberry_pi_4
  min_clients: 1
  num_clients: 40
  sample_fraction: 1.0
  sampling_strategy: random
cost_model: measured
data:
  alpha: 1.0
  data_root: ./data
  dataset: cifar10
  model: resnet8
  partition: dirichlet
device: mps
layer_mismatch: false
model:
  architecture: resnet8
output_dir: ./results/E1_a1/fedpart
seed: 42
training:
  algo_config:
    optimizer: adam
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0001
    local_epochs: 8
    batch_size: 32
    warmup_rounds: 5
    rounds_per_layer: 2
    training_cycles: 5
    num_layer_groups: 10
    layer_selection: sequential
    active_group_idx: null
    num_tiers: 4
    server_lr: null
    assignment_strategy: quantile
    mu_repr: 0.01
    mu_weight: 0.0
    ema_model_alpha: 0.0
    rotation_period: 3
    adaptive_rotation: false
    inter_cycle_rounds: 0
    energy_scale_factor: 3.0
    alpha_applies_to: compute
    max_grad_norm: 10.0
    ema_alpha: 0.3
    persist_optimizer: false
    enforce_staleness_cap: false
    rank_min: 4
    rank_max: 16
    spectral_energy_thresh: 0.75
    use_rsvd: true
    use_error_feedback: true
    svd_fast: true
    subspace_drift_thresh: 0.1
    rank_coherence_thresh: 0.7
    rsvd_oversample: 10
    rsvd_power_iter: 2
    cost_model: measured
  algorithm: fedpart
  num_rounds: 200
