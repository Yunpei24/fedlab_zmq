# Client-level TERM reference. Sweep tilt around 0; t=0 is uniform averaging.
seed: 42
output_dir: ./results/far_references/term
device: cpu

data:
  dataset: fashionmnist
  model: lenet5
  partition: dirichlet
  alpha: 0.1
  data_root: ./data

model:
  architecture: lenet5

training:
  num_rounds: 100
  algorithm: term
  algo_config:
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.0
    local_epochs: 1
    batch_size: 32
    tilt: 0.5
    client_prior: uniform
    client_metrics_every: 5
    fairness_tail_fraction: 0.2

clients:
  num_clients: 20
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 20
  fleet:
    - type: raspberry_pi_4
      count: 20
  battery_init:
    distribution: uniform_soc
    params: {min_soc: 0.9, max_soc: 0.95}
