seed: 2
output_dir: ./results/emnist_phase2/tail_dual_p
device: cpu
cost_model: phi
layer_mismatch: false
data:
  dataset: emnist
  model: cnn_gn
  partition: dirichlet
  partition_seed: 302
  alpha: 0.1
  data_root: ./data
model:
  architecture: cnn_gn
training:
  num_rounds: 150
  algorithm: dmd_tail
  algo_config:
    lr: 0.03
    momentum: 0.9
    weight_decay: 0.0001
    local_epochs: 1
    batch_size: 64
    num_classes: 62
    class_weight_mode: uniform
    reference_mode: fixed_zero
    reference_method: median
    min_reference_clients: 2
    context_policy: one_round_stale
    warmup_rounds: 2
    anchor_fraction: 0.23
    anchor_batch_size: 256
    max_train_samples: 500
    max_anchor_samples: 150
    min_train_samples: 50
    require_anchor_dataloader: true
    client_metrics_every: 5
    global_eval_every: 5
    client_eval_max_batches: 12
    device: cpu
    device_profile: null
    margin_space: probability
    cvar_tail_mass: 0.25
    cvar_eta_mode: dual
    cvar_eta_lr: 0.1
    mean_mu: 10.0
    dispersion_mu: 2.5
clients:
  num_clients: 10
  sample_fraction: 0.5
  sampling_strategy: round_robin
  min_clients: 5
  dropout_rate: 0.2
  fleet:
  - type: raspberry_pi_4
    count: 10
