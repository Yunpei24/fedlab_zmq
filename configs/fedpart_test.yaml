training:
  algorithm: fedpart
  num_rounds: 110         # 5 warmup + 5 cycles × 10 groupes × 2 rpl = 105 PNU
  algo_config:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 2        # 8 = setting papier (grande flotte). Avec 4 clients,
                           # 8 epochs → client drift catastrophique en PNU.
                           # Utiliser 1-2 pour les tests locaux MacBook.
    batch_size: 32
    warmup_rounds: 5
    rounds_per_layer: 2    # rpl
    training_cycles: 5     # C — informatif, stopping contrôlé par num_rounds
    num_layer_groups: 10   # M
    layer_selection: "sequential"
data:
  dataset: cifar10
  alpha: 1
  partition: dirichlet
model:
  architecture: resnet8
clients:
  num_clients: 4
  # Client sampling (optional — default: all clients participate every round)
  sample_fraction: 1.0        # fraction selected per round (e.g. 0.5 = 50%)
  sampling_strategy: random   # random | battery_aware | round_robin
  min_clients: 2              # minimum clients regardless of fraction
  fleet:
    - type: smartphone_highend
      count: 2
    - type: jetson_nano
      count: 2
seed: 42
output_dir: ./results/fedpart_test