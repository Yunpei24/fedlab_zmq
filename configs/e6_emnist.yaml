# =====================================================================
# E6 cross-dataset — EMNIST/ByClass (the Dirichlet fallback, NOT true LEAF FEMNIST)
# =====================================================================
# This is the honest label for the "femnist" Dirichlet path: data/femnist has no
# LEAF JSON, so dataset "femnist" falls back to EMNIST/ByClass (62 classes,
# ~17k samples/client at 40 clients). With E=8 that is ~18x heavier than the
# CIFAR-100 E6 run and crashes the RPi-4 fleet in warmup, so here:
#   - dataset: emnist  (explicit ByClass; NOT the LEAF natural partition)
#   - local_epochs: 1  (LIGHTER than the E=8 iso-setup; footnote the deviation)
# For the REAL FEMNIST (natural per-writer split), see configs/e6_femnist_natural.yaml
# (needs `bash scripts/prepare_femnist.sh` first).
# =====================================================================

seed: 42
output_dir: "./results/E6/emnist"
device: mps
cost_model: measured

layer_mismatch: false

data:
  dataset: emnist
  model: resnet8
  partition: dirichlet
  alpha: 1.0                  # NIID mild (same Dirichlet alpha as E1/E3/E6)
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 200
  algorithm: fedpart_be
  algo_config:
    optimizer: adam
    lr: 0.001
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 1           # LIGHTER than iso E=8 (EMNIST-ByClass is data-heavy)
    batch_size: 32
    warmup_rounds: 5
    num_tiers: 4
    server_lr: null
    assignment_strategy: quantile
    mu_repr: 0.01
    mu_weight: 0.0
    ema_model_alpha: 0.0
    rotation_period: 3
    adaptive_rotation: false
    inter_cycle_rounds: 0
    energy_scale_factor: 1.5  # Jetson physical alpha (EMNIST data volume needs the
                              # more capable device; RPi-4 dies in warmup even at E=1)
    alpha_applies_to: compute
    max_grad_norm: 10.0
    ema_alpha: 0.3
    persist_optimizer: false
    enforce_staleness_cap: false
    rank_min: 4
    rank_max: 16
    spectral_energy_thresh: 0.75
    use_rsvd: true
    use_error_feedback: true
    svd_fast: true
    subspace_drift_thresh: 0.1
    rank_coherence_thresh: 0.7
    rsvd_oversample: 10
    rsvd_power_iter: 2

clients:
  num_clients: 40
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 1

  fleet:
    - type: jetson_nano
      count: 40

  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.05
      max_soc: 0.55
