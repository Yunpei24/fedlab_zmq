  null_pairwise_ks_max: 0.10
  clean_geometry_correlation_min: 0.50
  honest_outlier_recall_at_5_min: 0.60
  honest_outlier_weight_mass_min_exclusive: 0.20
  score_degenerate_rate_max: 0.10
