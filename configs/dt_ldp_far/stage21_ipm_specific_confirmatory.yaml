  # paired candidate(alpha_max) - same-pipeline uniform(alpha=0).
  no_attack_test_accuracy_difference_mean_min_pp: -1.0
  no_attack_test_accuracy_difference_each_min_pp: -3.0
  ipm_test_accuracy_gain_mean_min_pp: 0.5
  ipm_positive_accuracy_gain_rate_min: 0.6666666666666666
  ipm_worst20_difference_mean_min_pp: -1.0
  ipm_byzantine_weight_mass_mean_max: 0.19
  ipm_byzantine_weight_mass_each_max: 0.195
  ipm_candidate_concentration_median_min: 1.005
  privacy_epsilon_difference_max: 0.01
