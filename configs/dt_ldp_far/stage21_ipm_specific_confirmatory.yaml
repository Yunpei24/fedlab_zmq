# This is a narrower, attack-specific confirmatory claim generated by the
# completed Stages 20C/20R. It is not evidence of universal Byzantine
# robustness. The horizon is doubled from 6 to 12 rounds.
experiments:
  - id: E32_stage21_ipm_specific_confirmatory
    scenarios: [fmnist_b01_n25_t12]
    methods: [dt_ldp_far_stage19_peer_support]
    references: [rfa]
    threats: [none, ipm20_n25]
    privacy: [eps4_c4_hetero_noise_n25]
