campaign_id: dt_ldp_far_stage15_crossfit_peer_support_v1
scope: frozen_synthetic_score_and_reference_audit_without_accuracy

cohort:
  num_clients: 25
  num_byzantine: 5
  ambient_dimension: 256
  honest_outliers: 5
  noise_std: 0.012
  public_noise_scales: [1.0, 1.5, 2.0]
  noise_permutations: [identity, rotate7, reverse]
  outlier_geometries: [aligned, orthogonal]
  threats: [none, ipm, alie, bitflip_x10, adaptive_aligned_jitter]

novelty:
  family: effective_moment
  reference: centered_clipping_leave_one_out
  fcc_radius: 0.13
  dimension: 256
  individual_calibration_weight: 1.0
  moment_z_clip: 4.0
  variance_ridge: 1.0e-12

robust_reference:
  candidates: [fcc, huber, rfa]
  fcc_radius: 0.13
  huber_radius: 0.13
  huber_gamma: 1.0
  huber_steps: 10
  rfa_max_iter: 50
  rfa_tolerance: 1.0e-7

support:
  profiles: [crossfit_covariance, crossfit_covariance_plus_peer_support]
  trust_logit_fraction: 0.50
  reference_reject_cosine: -0.10
  reference_full_support_cosine: 0.25
  peer_reject_cosine: 0.00
  peer_full_support_cosine: 0.20
  extra_honest_supporters: 1
  independence_low_null_quantile: 0.05
  independence_full_trust_null_quantile: 0.50
  independence_trust_floor: 0.05

weights:
  kappa_w: 2.0

aggregation:
  server_clip_norm: 0.42

randomness:
  calibration_seed: 2026091501
  null_holdout_seed: 2026091502
  signal_seeds: [28, 36, 54]
  calibration_draws: 256
  null_holdout_draws: 256
  signal_draws: 16

gates:
  null_abs_score_noise_correlation_max: 0.10
  null_noise_tier_score_range_max: 0.05
  null_pairwise_ks_max: 0.10
  clean_geometry_correlation_min: 0.50
  honest_outlier_recall_at_5_min: 0.60
  honest_outlier_weight_mass_min_exclusive: 0.20
  max_individual_weight: 0.08
  attacked_byzantine_weight_mass_max: 0.20
  attacked_global_honest_outlier_recall_at_5_min: 0.35
  support_honest_minus_byzantine_min: 0.10
  support_clean_recall_loss_max: 0.05
  support_clean_outlier_mass_loss_max: 0.02
  robust_reference_error_over_honest_dispersion_max: 1.00

decision:
  accuracy_must_not_be_used: true
  every_attack_and_geometry_must_pass: true
  score_and_reference_gates_are_reported_separately: true
  at_most_two_candidates_for_end_to_end: true
  if_no_full_survivor: do_not_launch_fashion_mnist
