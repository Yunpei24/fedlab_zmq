experiment: DT-LDP-FAR Stage 8 frozen debiased-distance screen
baseline_mode: raw
candidate_mode: debiased_distance_empirical_covariance

# These rules are fixed before reading the Stage-8 results. Accuracy is absent
# because this screen freezes the clean updates and identifies only the score
# mechanism.
honest_outlier_gate:
  min_fraction_clean_correlation_improved: 0.5
  min_fraction_weight_l1_improved: 0.5
  min_fraction_top5_recall_not_worse: 0.5
  min_fraction_all_three: 0.5

noise_only_gate:
  max_median_absolute_noise_scale_correlation: 0.25
  max_mean_weight_concentration: 1.08
  min_mean_score_span: 0.02

promotion_rule: all_thresholds
decision_note: >-
  Promote to an end-to-end screen only if the candidate recovers absolute
  clean geometry on a majority of paired honest-outlier strata and does not
  manufacture a strong public-noise-tier signal on noise-only strata.
