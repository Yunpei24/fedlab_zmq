  max_individual_weight: 0.08
  attacked_byzantine_weight_mass_max: 0.20
  attacked_global_honest_outlier_recall_at_5_min: 0.35
  trust_recall_loss_max: 0.05
  trust_honest_outlier_mass_loss_max: 0.02
  robust_reference_error_over_honest_dispersion_max: 0.75
  guarded_attack_error_reduction_min: 0.20
