aggregation:
  server_clip_norm: 0.42
  kappa_w: 2.0
  guard_radius_fractions: [raw, 0.50, 0.25, 0.10, 0.0]

randomness:
  calibration_seed: 2026091401
  null_holdout_seed: 2026091402
  signal_seeds: [28, 36, 54]
  calibration_draws: 512
  null_holdout_draws: 512
  signal_draws: 30

gates:
