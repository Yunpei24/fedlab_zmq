preregistration:
  primary_question: >-
    Does removing the [0,1] score transformation improve fairness or utility
    under local DP when the raw-distance tilt is rescaled by the public 2U
    range so the same kappa_w/n influence cap is retained?
  comparisons_are_paired: true
  selection_uses_all_three_seeds: true
  note: >-
    The bounded and raw DT arms differ only in score transform and the public
    alpha scaling required by that transform. Noise-aware direct-score modes
    are not silently converted to unbounded scores.

