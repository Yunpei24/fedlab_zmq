      fixed_batch_size: 120
      fixed_steps_per_round: null
      privacy_noise_multiplier_scale_by_client: [1.0, 1.5, 2.0, 1.5, 1.0, 2.0, 1.0, 1.5, 2.0, 1.5, 1.0, 2.0, 1.5, 1.0, 2.0, 1.5, 1.0, 2.0, 1.5, 1.0, 2.0, 1.5, 1.0, 2.0, 1.5]
