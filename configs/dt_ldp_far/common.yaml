tilts:
  uniform: {tau_fraction_of_max: 0.0, kappa_w: 2.0}
  mild: {tau_fraction_of_max: 0.25, kappa_w: 2.0}
  medium: {tau_fraction_of_max: 0.50, kappa_w: 2.0}
  boundary: {tau_fraction_of_max: 1.0, kappa_w: 2.0}
  # A wider but still certified lane: q_max <= 5/n.
  boundary_k5: {tau_fraction_of_max: 1.0, kappa_w: 5.0}
  # Geometry-specific exact slope match for Stage 27. With U=0.42 and
  # D_score=0.441, this kappa makes alpha_raw=alpha_bounded/D_score while the
  # public raw-distance range [0,2U] still yields an explicit q_max cap.
  boundary_raw_slope_u42_d441:
    tau_fraction_of_max: 1.0
    kappa_w: 3.617754018678074
  # Wide certified diagnostic: q_max <= 10/n. This is not the paper's
  # primary kappa_w=2 operating point; it tests a visibly larger logit range
  # while retaining an explicit influence certificate.
  boundary_k10: {tau_fraction_of_max: 1.0, kappa_w: 10.0}
  # Explicit falsification lanes.  Local DP is unchanged because server-side
  # tilting is post-processing of already-private uploads, but the kappa/n
  # influence certificate is intentionally not claimed in these runs.
  stress2_uncertified:
    tau_fraction_of_max: 2.0
    kappa_w: 2.0
    algo_config:
      tilt_bound_policy: diagnostic_only
      allow_uncertified_tilt_diagnostic: true
  stress4_uncertified:
    tau_fraction_of_max: 4.0
    kappa_w: 2.0
    algo_config:
      tilt_bound_policy: diagnostic_only
      allow_uncertified_tilt_diagnostic: true
  # Stronger falsification lanes. They preserve local DP by post-processing,
  # but intentionally abandon the kappa_w/n influence certificate.
  stress8_uncertified:
    tau_fraction_of_max: 8.0
    kappa_w: 2.0
    algo_config:
      tilt_bound_policy: diagnostic_only
      allow_uncertified_tilt_diagnostic: true
  stress12_uncertified:
    tau_fraction_of_max: 12.0
    kappa_w: 2.0
    algo_config:
      tilt_bound_policy: diagnostic_only
      allow_uncertified_tilt_diagnostic: true
