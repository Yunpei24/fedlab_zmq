schema_version: 1
protocol_id: dt_ldp_far_e1_e8_v1

base_config:
  device: cpu
  data:
    dataset: fashionmnist
    model: lenet5
    partition: client_dirichlet_balanced
    alpha: 0.1
    partition_seed: 28
    data_root: ./data
  model:
    architecture: lenet5
  training:
    num_rounds: 40
    cost_model: measured
    algorithm: dt_ldp_far
    algo_config:
      lr: 0.01
      momentum: 0.0
      weight_decay: 0.0
      local_epochs: 1
      batch_size: 64
      per_sample_backend: vectorized
      sampling_scheme: fixed_minibatch
      privacy_adjacency: unspecified
      poisson_steps_per_round: null
      clip_norm: 1.0
      server_clip_norm: 1.0
      distance_clip: 2.0
      tilt_tau: 0.1
      tilt_delay_rounds: 1
      kappa_w: 2.0
      tilt_bound_policy: error
      dt_reference: centered_clipping
      reference_clip_radius: 1.0
      anchor_update_rate: 0.1
      anchor_clip_norm: 1.0
      num_byzantine: 0
      require_full_participation: true
      expected_num_clients: 10
      enable_oracle_diagnostics: true
      enable_private_client_oracle_diagnostics: false
      client_metrics_every: 2
      fairness_tail_fraction: 0.2
  clients:
    num_clients: 10
    sample_fraction: 1.0
    sampling_strategy: random
    min_clients: 10
    dropout_rate: 0.0
    fleet:
      - type: raspberry_pi_4
        count: 10
    battery_init:
      distribution: uniform_soc
      params: {min_soc: 0.95, max_soc: 0.95}
  eval:
    eval_every: 2
    honest_clients_only: true

seed_pairs:
  - {partition_seed: 28, training_seed: 28}
  - {partition_seed: 36, training_seed: 36}
  - {partition_seed: 54, training_seed: 54}
  # Additional crossed pairs used to separate optimisation randomness from
  # partition sensitivity in the decisive campaign.  The first three entries
  # are intentionally unchanged so all earlier matrix indices remain stable.
  - {partition_seed: 28, training_seed: 36}
  - {partition_seed: 28, training_seed: 54}
  - {partition_seed: 36, training_seed: 28}
  - {partition_seed: 36, training_seed: 54}
  - {partition_seed: 54, training_seed: 28}
  - {partition_seed: 54, training_seed: 36}
  # Independent end-to-end confirmation seeds introduced only after the
  # Stage-19 vector holdout had frozen the RFA + 50% peer-support candidate.
  - {partition_seed: 71, training_seed: 71}
  - {partition_seed: 83, training_seed: 83}
  - {partition_seed: 97, training_seed: 97}
  # Fresh confirmatory seeds for the narrower IPM-specific hypothesis. They
  # were registered only after Stages 20C/20R generated that hypothesis.
  - {partition_seed: 109, training_seed: 109}
  - {partition_seed: 127, training_seed: 127}
  - {partition_seed: 149, training_seed: 149}
  # Stage-22 lagged-descent study. Seed 163 is an integration screen only;
  # 179, 193 and 211 form the untouched confirmatory holdout.
  - {partition_seed: 163, training_seed: 163}
  - {partition_seed: 179, training_seed: 179}
  - {partition_seed: 193, training_seed: 193}
  - {partition_seed: 211, training_seed: 211}
  # Stage-23 robust-admissibility study. Seed 271 is an integration screen;
  # 277, 283 and 293 are an untouched end-to-end holdout.
  - {partition_seed: 271, training_seed: 271}
  - {partition_seed: 277, training_seed: 277}
  - {partition_seed: 283, training_seed: 283}
  - {partition_seed: 293, training_seed: 293}
  # Stage-24 Multi-Krum admissibility study. Seed 307 is an integration
  # screen; 311, 313 and 317 are a new untouched end-to-end holdout.
  - {partition_seed: 307, training_seed: 307}
  - {partition_seed: 311, training_seed: 311}
  - {partition_seed: 313, training_seed: 313}
  - {partition_seed: 317, training_seed: 317}
  # Stage-25 robust-anchor containment study. Seed 331 is an integration
  # screen; 337, 347 and 349 are a new untouched end-to-end holdout.
  - {partition_seed: 331, training_seed: 331}
  - {partition_seed: 337, training_seed: 337}
  - {partition_seed: 347, training_seed: 347}
  - {partition_seed: 349, training_seed: 349}
  # Stage-26 robust-anchor selection and confirmation. Seed 353 is the only
  # selection screen. Seeds 359, 367 and 373 are locked before that screen and
  # remain untouched until one anchor has been selected mechanically.
  - {partition_seed: 353, training_seed: 353}
  - {partition_seed: 359, training_seed: 359}
  - {partition_seed: 367, training_seed: 367}
  - {partition_seed: 373, training_seed: 373}

scenarios:
  fmnist_b01:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b05:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.5}
    model: {architecture: lenet5}
    training:
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b01_t40:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 40
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b01_t80:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 80
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b01_t120:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 120
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b05_t40:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.5}
    model: {architecture: lenet5}
    training:
      num_rounds: 40
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b05_t80:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.5}
    model: {architecture: lenet5}
    training:
      num_rounds: 80
      algo_config: {privacy_public_dataset_size: 6001}
  fmnist_b05_t120:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.5}
    model: {architecture: lenet5}
    training:
      num_rounds: 120
      algo_config: {privacy_public_dataset_size: 6001}
  # Short ten-client gate: geometry is calibrated here before any expensive
  # 25-client confirmatory task is promoted.
  fmnist_b01_n10_t20:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 20
      algo_config: {privacy_public_dataset_size: 6001}
  # Class-centric Dirichlet ablation. Contrary to
  # client_dirichlet_balanced, client sizes are not controlled. Train and
  # held-out test shards nevertheless reuse matched public Dirichlet streams
  # through run_experiment.py so client-level fairness remains meaningful.
  # The public capacity 12000 is fixed before training and covers the largest
  # local shard for the pre-registered seeds 28, 36 and 54 (observed public
  # maximum: 11935). It is not inferred from a private runtime cardinality.
  fmnist_b01_n10_t20_class_dirichlet:
    data:
      dataset: fashionmnist
      model: lenet5
      partition: dirichlet
      alpha: 0.1
    model: {architecture: lenet5}
    training:
      num_rounds: 20
      algo_config: {privacy_public_dataset_size: 12000}
  # Twelve-round confirmatory horizon for the post-hoc IPM-specific claim.
  # 2401 is a public padded capacity, not the realised private cardinality.
  fmnist_b01_n25_t12:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 12
      algo_config: {privacy_public_dataset_size: 2401}
    clients:
      num_clients: 25
      min_clients: 25
      fleet: [{type: raspberry_pi_4, count: 25}]
  # FAR's paper-scale cohort. Balanced FMNIST gives approximately 2400
  # training records per client; 2401 is a public padded capacity used by the
  # add/remove Poisson mechanism and never the realised private cardinality.
  fmnist_b01_n25_t20:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 20
      algo_config: {privacy_public_dataset_size: 2401}
    clients:
      num_clients: 25
      min_clients: 25
      fleet: [{type: raspberry_pi_4, count: 25}]
  # Short mechanism-discovery horizon.  Accuracy is not used to select a
  # profile; only the pre-registered geometry/noise gates are evaluated.
  fmnist_b01_n25_t6:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 6
      algo_config: {privacy_public_dataset_size: 2401}
    clients:
      num_clients: 25
      min_clients: 25
      fleet: [{type: raspberry_pi_4, count: 25}]
  fmnist_b01_n25_t80:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 80
      algo_config: {privacy_public_dataset_size: 2401}
    clients:
      num_clients: 25
      min_clients: 25
      fleet: [{type: raspberry_pi_4, count: 25}]
  fmnist_b01_n25_t120:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.1}
    model: {architecture: lenet5}
    training:
      num_rounds: 120
      algo_config: {privacy_public_dataset_size: 2401}
    clients:
      num_clients: 25
      min_clients: 25
      fleet: [{type: raspberry_pi_4, count: 25}]
  fmnist_b05_n25_t80:
    data: {dataset: fashionmnist, model: lenet5, alpha: 0.5}
    model: {architecture: lenet5}
    training:
      num_rounds: 80
      algo_config: {privacy_public_dataset_size: 2401}
    clients:
      num_clients: 25
      min_clients: 25
      fleet: [{type: raspberry_pi_4, count: 25}]
  cifar10_b01:
    data: {dataset: cifar10, model: alexnet, alpha: 0.1}
    model: {architecture: alexnet}
    training:
      algo_config: {privacy_public_dataset_size: 5001}

methods:
  fedavg_no_dp:
    algorithm: fedavg
    algo_config: {enable_dp: false}
    comparison_lane: native_non_private
  far_no_dp:
    algorithm: far
    algo_config: {far_alpha: 0.1}
    comparison_lane: native_non_private
  clipped_fedavg_no_dp:
    algorithm: dpfedavg
    algo_config: {enable_dp: false, noise_multiplier: 0.0, target_epsilon: null}
    comparison_lane: poisson_no_noise_clipping_matched
  clipped_far_no_dp:
    algorithm: dpfar
    algo_config:
      enable_dp: false
      noise_multiplier: 0.0
      target_epsilon: null
      far_score_mode: bounded_normalized
    comparison_lane: poisson_no_noise_clipping_matched
  dt_no_dp:
    algorithm: dt_ldp_far
    algo_config: {enable_dp: false, noise_multiplier: 0.0, target_epsilon: null}
    comparison_lane: poisson_no_noise_clipping_matched
  dp_fedavg:
    algorithm: dpfedavg
    comparison_lane: true_poisson_add_remove
  dp_qffl:
    algorithm: dpqffl
    algo_config: {q: 1.0, aggregation_prior: uniform}
    comparison_lane: true_poisson_add_remove_with_private_loss_channel
  fedfdp:
    algorithm: fedfdp
    algo_config:
      fairness_lambda: 0.1
      loss_clip: 2.5
      target_epsilon_includes_auxiliary_channels: true
    comparison_lane: legacy_alias_do_not_use_for_cross_method_claims
  fedfdp_native:
    algorithm: fedfdp
    algo_config:
      fairness_lambda: 0.1
      loss_clip: 2.5
      target_epsilon_includes_auxiliary_channels: true
      max_local_batches: null
    comparison_lane: fedfdp_native_fixed_minibatch
  fedfdp_compute_matched:
    algorithm: fedfdp
    algo_config:
      fairness_lambda: 0.1
      loss_clip: 2.5
      target_epsilon_includes_auxiliary_channels: true
      max_local_batches: 5
    comparison_lane: fixed_minibatch_five_step_compute_matched
  dp_far_current:
    algorithm: dpfar
    algo_config: {far_alpha: 0.1}
    comparison_lane: original_far_raw_distance
  dp_far_current_matched:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      suppress_private_client_diagnostics: true
    comparison_lane: true_poisson_current_round_bounded_score_privacy_safe_transcript
  dp_far_current_matched_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_oracle_diagnostic
  dp_far_current_noise_scale_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: client_noise_scale
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_public_noise_scale_diagnostic
  dp_far_current_covariance_proxy_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_covariance_proxy
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_public_covariance_proxy_diagnostic
  dp_far_current_excess_energy_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_excess_energy
      noise_score_z_clip: 5.0
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_excess_energy_oracle_diagnostic
  dp_far_current_debiased_distance_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_debiased_distance
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_debiased_distance_oracle_diagnostic
  # Generation-4 score selected by the frozen synthetic train/holdout gate.
  # Its null calibration uses deterministic artificial Gaussian draws from
  # public DP-mechanism parameters, hence consumes no additional privacy.
  dp_far_current_null_mc_robust:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_null_mc_moment_calibrated_independence_orthogonalized
      noise_score_null_mc_draws: 64
      noise_score_null_mc_seed: 20260906
      noise_score_z_clip: 4.0
      noise_score_trust_floor: 0.05
      noise_score_independence_low_quantile: 0.05
      noise_score_independence_full_quantile: 0.50
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: true
    comparison_lane: true_poisson_current_round_generation4_null_mc_privacy_safe
  dp_far_current_null_mc_robust_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_null_mc_moment_calibrated_independence_orthogonalized
      noise_score_null_mc_draws: 64
      noise_score_null_mc_seed: 20260906
      noise_score_z_clip: 4.0
      noise_score_trust_floor: 0.05
      noise_score_independence_low_quantile: 0.05
      noise_score_independence_full_quantile: 0.50
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_generation4_null_mc_oracle
  # Generation-4 ablation: exact leave-one-out FCC residual, excess energy,
  # directional trust and null-calibrated anti-collusion trust.
  dp_far_current_loo_excess_robust:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_loo_excess_calibrated_dual_trust_orthogonalized
      noise_score_null_mc_draws: 64
      noise_score_null_mc_seed: 20260906
      noise_score_z_clip: 5.0
      noise_score_trust_floor: 0.05
      noise_score_reject_cosine: -0.10
      noise_score_full_trust_cosine: 0.25
      noise_score_independence_low_quantile: 0.05
      noise_score_independence_full_quantile: 0.50
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: true
    comparison_lane: true_poisson_current_round_generation4_loo_privacy_safe
  dp_far_current_loo_excess_robust_oracle:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_loo_excess_calibrated_dual_trust_orthogonalized
      noise_score_null_mc_draws: 64
      noise_score_null_mc_seed: 20260906
      noise_score_z_clip: 5.0
      noise_score_trust_floor: 0.05
      noise_score_reject_cosine: -0.10
      noise_score_full_trust_cosine: 0.25
      noise_score_independence_low_quantile: 0.05
      noise_score_independence_full_quantile: 0.50
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: false
      enable_private_client_oracle_diagnostics: true
      enable_noise_free_counterfactual_oracle: true
      non_private_diagnostic_transcript: true
    comparison_lane: non_private_current_round_generation4_loo_oracle
  # Generation 5: exact midrank calibration inside each discrete public
  # noise tier. Difficulty and robust trust share one bounded logit budget.
  # The deployable profiles suppress every private/oracle diagnostic.
  dp_far_current_tier_rank_no_trust:
    algorithm: dpfar
    algo_config:
      far_score_mode: bounded_normalized
      noise_score_standardization: isotropic_dp_null_mc_moment_tier_robust_separate_trust
      noise_score_null_mc_draws: 64
      noise_score_null_mc_seed: 20260906
      noise_score_z_clip: 4.0
      noise_score_trust_floor: 0.05
      noise_score_reject_cosine: -0.10
      noise_score_full_trust_cosine: 0.25
      noise_score_independence_low_quantile: 0.05
      noise_score_independence_full_quantile: 0.50
      noise_score_trust_logit_fraction: 0.0
      noise_score_include_server_contraction: true
      suppress_private_client_diagnostics: true
    comparison_lane: true_poisson_current_round_generation5_tier_rank_no_trust
  dp_far_current_tier_rank_fairness:
