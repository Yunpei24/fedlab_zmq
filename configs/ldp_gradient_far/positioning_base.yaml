seed: 137
output_dir: ./results/ldp_gradient_far/positioning_v1/placeholder
device: mps

data:
  dataset: fashionmnist
  model: lenet5_tanh
  partition: client_dirichlet_balanced
  alpha: 0.1
  partition_seed: 137
  data_root: ./data

model:
  architecture: lenet5_tanh

training:
  num_rounds: 20
  cost_model: measured
  algorithm: ldp_gradient_far
  algo_config:
    # One fixed-cardinality gradient release per client and round.  Keeping the
    # sampler identical in the DP and no-DP arms isolates the Gaussian noise.
    batch_size: 300
    local_epochs: 1
    fixed_steps_per_round: 1
    sampling_scheme: fixed_without_replacement
    privacy_adjacency: replace_one
    privacy_public_dataset_size: 6000
    privacy_sampling_rate_override: 0.05
    fixed_batch_size: 300
    per_sample_backend: vectorized

    enable_dp: false
    target_epsilon: null
    noise_multiplier: 0.0
    privacy_num_rounds: 20
    delta: 1.0e-5
    clip_norm: 8.0

    # Raw-distance FAR.  The kappa-derived alpha cap is recorded as a
    # diagnostic only; the positioning sweep intentionally crosses it.
    far_server_lr: 0.20
    far_server_clip_norm: 16.0
    far_score_mode: raw_distance
    noise_score_standardization: none
    noise_score_include_server_contraction: false
    score_subspace_mode: full
    far_alpha: 0.0
    kappa_w: 2.0
    tilt_bound_policy: diagnostic

    robust_reference: centered_clipping
    num_byzantine: 2
    reference_clip_radius: 8.0
    anchor_update_rate: 0.1
    anchor_clip_norm: 16.0
    rfa_max_iter: 100
    rfa_tol: 1.0e-6

    expected_num_clients: 10
    client_metrics_every: 2
    fairness_tail_fraction: 0.2
    suppress_private_client_diagnostics: true

    attack:
      enabled: false
      name: none
      scale: 1.0
      num_byzantine: 0
      client_ids: []

clients:
  num_clients: 10
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 10
  dropout_rate: 0.0
  fleet:
    - type: raspberry_pi_4
      count: 10
  battery_init:
    distribution: uniform_soc
    params: {min_soc: 0.95, max_soc: 0.95}

eval:
  eval_every: 2
  honest_clients_only: true
