campaign_id: fair_objective_confirmation_v3
device: mps
dataset: fashionmnist
model: lenet5_tanh
partition: client_dirichlet_balanced
dirichlet_beta: 0.1
num_clients: 10
public_train_size: 4800
validation_size: 1200
batch_size: 240
rounds: 60
release_count_per_round: 1
local_optimizer_steps: 0
server_aggregation: uniform
server_clip: null
attacks: none
evaluation_seeds: [170401, 170402, 170403, 170404]
arms:
  brier_fair_C1: {C: 1.0, base_lr: 2.0, beta: 2.0}
  brier_erm_C1: {C: 1.0, base_lr: 2.0, beta: 0.0}
  brier_erm_C2: {C: 2.0, base_lr: 2.0, beta: 0.0}
initial_uniform_brier: 0.45
epsilon: 4.0
delta: 1.0e-5
sampling: fixed_without_replacement
adjacency: replace_one
evaluation_rounds: [1, 5, 10, 15, 20, 30, 40, 50, 60]
expected_runs: 12
test_only_after_all_training: true
test_checkpoint: 60
automatic_followup: false
gate:
  candidate: brier_fair_C1
  controls: [brier_erm_C1, brier_erm_C2]
  primary: worst20_pct
  minimum_mean_gain_pp: 1.0
  primary_ci_lower_strictly_above: 0.0
  accuracy_ni_margin_pp: 1.0
  ci_method: paired_student_two_sided_95
  required_seeds: 4
protocol: output/analysis/Fair_Objective_Confirmation_V3_Protocol.md
