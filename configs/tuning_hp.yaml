# ============================================================
# Phase 1 — Tuning des hyperparamètres (fedpart_be + ccsEF)
# ============================================================
# Scénario : 30 ESP32-S3, SOC uniforme [30%, 60%]
# → clients survivent ~100 rounds → convergence visible pour chaque algo
# → tuning indépendant du scénario de test (SOC [5-15%])
#
# Grille de tuning (encodée dans hpc_phase1_tuning.sh) :
#   fedavg      : E ∈ {3, 5, 8}                          → 3  runs
#   fedpart_be  : (E, num_tiers) ∈ {3,5,8} × {2,3,4}     → 9  runs
#   ccsEF_full  : (E, T_rot)    ∈ {1,3,5} × {1,3,5}      → 9  runs
#   ccsEF_frozen: (E, T_rot)    ∈ {1,3,5} × {1,3,5}      → 9  runs
#   Total : 30 runs SLURM (--array=0-29)
#
# Critère : Best Accuracy sur 100 rounds
# ============================================================

seed: 42
output_dir: "./results/tuning"
layer_mismatch: false
device: cuda          # remplacé par --device cpu sur HPC sans GPU

data:
  dataset: cifar10
  partition: dirichlet
  alpha: 0.5
  data_root: ./data

model:
  architecture: resnet8

training:
  num_rounds: 100
  algorithm: fedpart_be     # écrasé par --algo en CLI

  algo_config:
    # ── Hyperparamètres communs ──────────────────────────────
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4
    local_epochs: 5           # écrasé par --epochs en CLI
    batch_size: 32

    # ── Batterie / énergie ───────────────────────────────────
    beta_min: 0.01
    beta_max: 1.0
    battery_max_j: 13320.0
    energy_scale_factor: 12.6

    # ── fedpart_be ───────────────────────────────────────────
    warmup_rounds: 5
    num_tiers: 3              # écrasé par le script tuning
    server_lr: null
    assignment_strategy: quantile
    mu_repr: 0.1
    mu_weight: 0.01
    ema_model_alpha: 0
    ema_alpha: 0.3
    verbose_groups: false
    rotation_period: 10
    adaptive_rotation: false
    inter_cycle_rounds: 0

    # ── ccsEF ────────────────────────────────────────────────
    ccsEF_warmup_rounds: 3    # SOC [30-60%] → 3 rounds warmup suffisants
    lr_min: 0.001
    max_grad_norm: 10.0
    T_rot: 3                  # écrasé par le script tuning
    fleet_median_battery: null
    freeze_secondary_backward: false  # écrasé par --freeze-secondary

    # ── fed_resonance (inclus pour cohérence) ────────────────
    rank_min: 4
    rank_max: 32
    spectral_energy_thresh: 0.95
    use_error_feedback: true
    use_rsvd: true
    rsvd_oversample: 10
    rsvd_power_iter: 2

clients:
  num_clients: 30
  sample_fraction: 1.0
  sampling_strategy: random
  min_clients: 3

  fleet:
    - type: esp32_s3
      count: 30

  # SOC [30%, 60%] : flotte avec énergie suffisante pour 100 rounds
  # Les clients survivent → convergence observable → bon pour tuning
  battery_init:
    distribution: uniform_soc
    params:
      min_soc: 0.30
      max_soc: 0.60
