seed: 1
output_dir: ./results/emnist_normmargin_mc/cbdmd_norm_hi/p308
device: mps
cost_model: phi
layer_mismatch: false
data:
  dataset: emnist
  model: cnn_gn
  partition: client_dirichlet_balanced
  partition_seed: 308
  alpha: 0.1
  data_root: ./data
model:
  architecture: cnn_gn
training:
  num_rounds: 150
  algorithm: dmd_mean
  algo_config:
    lr: 0.03
    momentum: 0.9
    weight_decay: 0.0001
    local_epochs: 1
    batch_size: 64
    num_classes: 62
    class_weight_mode: uniform
    reference_mode: fixed_zero
    reference_method: median
    min_reference_clients: 2
    context_policy: one_round_stale
    warmup_rounds: 2
    anchor_fraction: 0.23
    anchor_batch_size: 256
    max_train_samples: 500
    max_anchor_samples: 150
    min_train_samples: 50
    require_anchor_dataloader: true
    client_metrics_every: 5
    global_eval_every: 5
    client_eval_max_batches: 12
    device: mps
    device_profile: null
    ce_class_weighting: inverse_frequency
    round_client_seeding: true
    margin_space: normalized
    mean_mu: 10.0
clients:
  num_clients: 10
  sample_fraction: 0.5
  sampling_strategy: round_robin
  min_clients: 5
  dropout_rate: 0.2
  fleet:
  - type: raspberry_pi_4
    count: 10
