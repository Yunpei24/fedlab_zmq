# Sweep sensibilité λ (KD local) = 1.0 — recette α=1 int4-const, s43.
# Réf λ=0.5: 73.1±0.1 (exits ~53/65/73.5). But: zone plate [0.25,1.0].
clients:
  battery_init:
    distribution: uniform_soc
    params:
      max_soc: 0.55
      min_soc: 0.05
  fleet:
  - count: 40
    type: raspberry_pi_4
  min_clients: 1
  num_clients: 40
  sample_fraction: 1.0
  sampling_strategy: random
cost_model: measured
data:
  alpha: 1.0
  data_root: ./data
  dataset: cifar10
  model: resnet8_ee
  partition: dirichlet
device: mps
layer_mismatch: false
model:
  architecture: resnet8_ee
output_dir: ./results/E1_a1_int4const_kd100
seed: 42
training:
  algo_config:
    alpha_applies_to: compute
    aux_loss_weight: 0.3
    batch_size: 64
    beta_budget: 0.05
    beta_mode: deadline
    deadline_rounds: 250
    ee_exempt_deep: 2
    ee_self_distill: 1.0
    ee_server_lr: 1.0
    ee_width_mode: adaptive
    ema_model_alpha: 0.3
    energy_scale_factor: 3.0
    exit_mode: early_exit
    local_epochs: 4
    lr: 0.003
    lr_schedule: constant
    max_grad_norm: 10.0
    momentum: 0.9
    mu_adapt_scale: 1.0
    mu_adaptive: true
    mu_repr: 0.01
    mu_weight: 0.0
    optimizer: adam
    persist_optimizer: false
    repr_anchor: boundary
    uplink_quant_bits: 4
    var_agg_tau: 4.0
    var_aware_agg: true
    warmup_rounds: 5
    weight_decay: 0.0001
  algorithm: fedstep
  num_rounds: 200
